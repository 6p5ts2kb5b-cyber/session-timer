<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>セッションタイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: one narrow instrument column — mode switch, dial, controls, then the session program below */
:root{
  --bg:#edf0f3; --surface:#fafbfc; --ink:#18202b; --muted:#5b6878; --line:#d3dae2;
  --accent:#2f4fd0; --accent-ink:#ffffff; --accent-soft:#e1e7fb;
  --warn:#c77700; --warn-soft:#fbeed6; --done:#2e7d57;
  --f-body:"BIZ UDPGothic","BIZ UDPゴシック","UD デジタル 教科書体 N","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"BIZ UDGothic","BIZ UDゴシック",ui-monospace,Menlo,monospace;
  --z:1;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1a2029; --ink:#e7ecf2; --muted:#94a2b3; --line:#2c3642;
  --accent:#8ea3ff; --accent-ink:#0f1530; --accent-soft:#232c4d;
  --warn:#f0a73a; --warn-soft:#3a2c14; --done:#5cc692; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1a2029; --ink:#e7ecf2; --muted:#94a2b3; --line:#2c3642;
  --accent:#8ea3ff; --accent-ink:#0f1530; --accent-soft:#232c4d;
  --warn:#f0a73a; --warn-soft:#3a2c14; --done:#5cc692; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:16px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;zoom:var(--z)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:.02em}
.voice{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.switch{position:relative;width:40px;height:22px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent-ink)}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 10px;font-weight:500;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.seg.small{display:inline-grid;font-size:.85rem}
.seg.small button{padding:5px 14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:16px;align-items:center}
.dial{position:relative;width:min(290px,calc(78vw / var(--z)));aspect-ratio:1;max-width:100%;container-type:inline-size}
.dial svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.dial .track{stroke:var(--line);fill:none}
.dial .prog{stroke:var(--accent);fill:none;stroke-linecap:round;transition:stroke .3s}
.dial.warn .prog{stroke:var(--warn)}
.dial.fin .prog{stroke:var(--done)}
.dial .ticks line{stroke:var(--muted);opacity:.45}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1cqw;padding:14%}
.face .lbl{font-size:5.4cqw;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face .big{font-family:var(--f-num);font-weight:400;font-size:17cqw;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.face .big small{font-size:.45em;color:var(--muted)}
.face .sub{font-family:var(--f-num);font-size:4.8cqw;color:var(--muted);font-variant-numeric:tabular-nums}
.dial.warn .big{color:var(--warn)}
.dial.fin .big{color:var(--done)}
.pill{display:inline-block;font-size:4.4cqw;padding:.1em .9em;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:700;letter-spacing:.04em}

.ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 20px;font-weight:500;min-width:88px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:130px;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}

.timeline{display:flex;gap:3px;width:100%;height:30px}
.timeline div{flex-grow:1;flex-basis:0;min-width:6px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.timeline div.cur{outline:2px solid var(--accent);outline-offset:1px}
.timeline div i{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.55}
.timeline div.past i{width:100%}
.remain{display:flex;justify-content:space-between;width:100%;font-size:.8rem;color:var(--muted);gap:8px;flex-wrap:wrap}
.remain b{font-family:var(--f-num);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}

h2{font-size:.78rem;letter-spacing:.12em;color:var(--muted);margin:0;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;text-align:left;line-height:1.3;max-width:200px}
.chip span{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip em{font-style:normal;font-size:.75rem;color:var(--muted);font-family:var(--f-num)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip.add{border-style:dashed;color:var(--muted);align-self:stretch;display:flex;align-items:center}

.editor{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px}
.txt{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto 32px;gap:6px;align-items:center}
.row .n{font-family:var(--f-num);color:var(--muted);font-size:.8rem;text-align:right}
.row.cur .n{color:var(--accent);font-weight:500}
.num{width:3.4em;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 4px;text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.unit{display:flex;align-items:center;gap:3px;font-size:.8rem;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem;border-radius:6px;height:32px}
.x:hover{background:var(--bg);color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.quick span{font-size:.8rem;color:var(--muted);margin-right:2px}
.qb{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 11px;font-family:var(--f-num);font-size:.85rem}
.qb:hover{border-color:var(--accent);color:var(--accent)}
.edfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.edfoot b{font-family:var(--f-num);color:var(--ink);font-weight:500}
.danger{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 12px;color:var(--muted);font-size:.8rem}
.danger.arm{border-color:#c43d3d;color:#c43d3d}
.empty{font-size:.85rem;color:var(--muted);padding:6px 0}

.setrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.laps{width:100%;border-top:1px solid var(--line);font-family:var(--f-num);font-size:.85rem;font-variant-numeric:tabular-nums;max-height:220px;overflow:auto}
.laps div{display:grid;grid-template-columns:3em 1fr 1fr;padding:6px 4px;border-bottom:1px solid var(--line)}
.laps div span:not(:first-child){text-align:right}
.laps .hd{color:var(--muted);font-family:var(--f-body);font-size:.75rem}
.note{font-size:.78rem;color:var(--muted);text-align:center;margin:0}
/* size controls & board (stage) mode */
.view{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vb{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-weight:700;min-width:40px}
.vb:hover{border-color:var(--accent)}
.vb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#zVal{font-family:var(--f-num);font-size:.85rem;color:var(--muted);min-width:3.2em;text-align:center}
.hdr-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
body.stage .wrap{max-width:none;zoom:1}
body.stage header{justify-content:flex-end}
body.stage .hide-stage{display:none!important}
body.stage .panel{border:0;background:none;padding:0;gap:2.2vh}
body.stage .dial{width:min(calc(56vh * var(--z)),94vw)}
body.stage .timeline{height:max(30px,3.6vh);max-width:min(calc(110vh * var(--z)),100%)}
body.stage .remain{font-size:clamp(.9rem,2.2vh,1.6rem);max-width:min(calc(110vh * var(--z)),100%)}
body.stage .btn{font-size:clamp(1rem,2.6vh,1.8rem);padding:.5em 1.4em}
body.stage .seg.small{font-size:clamp(.85rem,2vh,1.3rem)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1 class="hide-stage">セッションタイマー</h1>
    <div class="hdr-right">
      <div class="view" aria-label="表示サイズ">
        <button class="vb" id="zOut" aria-label="小さくする">A−</button>
        <span id="zVal">100%</span>
        <button class="vb" id="zIn" aria-label="大きくする">A＋</button>
        <button class="vb" id="stageBtn" aria-pressed="false">大画面</button>
      </div>
      <div class="voice">音声
        <button class="switch" id="voiceSw" role="switch" aria-checked="true" aria-label="音声アナウンス"></button>
      </div>
    </div>
  </header>

  <div class="seg" role="tablist">
    <button role="tab" id="tabTimer" aria-selected="true">タイマー</button>
    <button role="tab" id="tabSw" aria-selected="false">ストップウォッチ</button>
  </div>

  <!-- ===== TIMER ===== -->
  <section id="viewTimer" style="display:flex;flex-direction:column;gap:18px">
    <div class="panel">
      <div class="seg small" role="group" aria-label="表示方向">
        <button id="tDown" aria-selected="true">カウントダウン</button>
        <button id="tUp" aria-selected="false">カウントアップ</button>
      </div>
      <div class="dial" id="tDial">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <g class="ticks" id="tTicks"></g>
          <circle class="track" cx="100" cy="100" r="88" stroke-width="8"/>
          <circle class="prog" id="tProg" cx="100" cy="100" r="88" stroke-width="8" stroke-dasharray="552.9" stroke-dashoffset="552.9"/>
        </svg>
        <div class="face">
          <div class="lbl" id="tSegLbl">—</div>
          <div class="big" id="tBig">00:00</div>
          <div class="sub" id="tSub"></div>
          <div id="tPill"></div>
        </div>
      </div>
      <div class="timeline" id="tLine"></div>
      <div class="remain"><span>経過 <b id="tElapsedAll">00:00</b></span><span>セッション残り <b id="tRemainAll">00:00</b></span></div>
      <div class="ctrls">
        <button class="btn" id="tReset">リセット</button>
        <button class="btn primary" id="tStart">開始</button>
        <button class="btn" id="tSkip">次の区間</button>
      </div>
    </div>

    <div class="hide-stage" style="display:flex;flex-direction:column;gap:10px">
      <h2>セッション</h2>
      <div class="chips" id="chips"></div>
    </div>

    <div class="editor hide-stage">
      <div class="field">
        <label for="sessTitle">題名</label>
        <input class="txt" id="sessTitle" maxlength="40" placeholder="例：朝の集中タイム">
      </div>
      <div>
        <div class="field"><label>区間（上から順に進みます）</label></div>
        <div class="rows" id="rows"></div>
      </div>
      <div class="quick"><span>区間を追加</span>
        <button class="qb" data-add="60">1分</button>
        <button class="qb" data-add="180">3分</button>
        <button class="qb" data-add="300">5分</button>
        <button class="qb" data-add="600">10分</button>
        <button class="qb" data-add="900">15分</button>
        <button class="qb" data-add="1800">30分</button>
      </div>
      <div class="edfoot">
        <span>合計 <b id="sessTotal">0:00</b></span>
        <button class="danger" id="delSess">このセッションを削除</button>
      </div>
    </div>
    <p class="note hide-stage">「A−／A＋」で表示サイズ、「大画面」で電子黒板向けの表示に切り替えます（キーボードでは −／＋／F）。各区間の終了1分前と終了時に音声でお知らせします。最初の2つは例として入れてあるセッションです。</p>
  </section>

  <!-- ===== STOPWATCH ===== -->
  <section id="viewSw" hidden style="flex-direction:column;gap:18px">
    <div class="panel">
      <div class="seg small" role="group" aria-label="計測方向">
        <button id="sUp" aria-selected="true">カウントアップ</button>
        <button id="sDown" aria-selected="false">カウントダウン</button>
      </div>
      <div class="setrow" id="sSet" hidden>
        <span class="unit"><input class="num" id="sMin" type="number" min="0" max="999" value="5" inputmode="numeric">分</span>
        <span class="unit"><input class="num" id="sSec" type="number" min="0" max="59" value="0" inputmode="numeric">秒</span>
        <button class="qb" data-sw="60">1分</button>
        <button class="qb" data-sw="300">5分</button>
        <button class="qb" data-sw="600">10分</button>
      </div>
      <div class="dial" id="sDial">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <g class="ticks" id="sTicks"></g>
          <circle class="track" cx="100" cy="100" r="88" stroke-width="8"/>
          <circle class="prog" id="sProg" cx="100" cy="100" r="88" stroke-width="8" stroke-dasharray="552.9" stroke-dashoffset="552.9"/>
        </svg>
        <div class="face">
          <div class="lbl" id="sLbl">ストップウォッチ</div>
          <div class="big" id="sBig">00:00<small>.00</small></div>
          <div class="sub" id="sSub"></div>
          <div id="sPill"></div>
        </div>
      </div>
      <div class="ctrls">
        <button class="btn" id="sReset">リセット</button>
        <button class="btn primary" id="sStart">開始</button>
        <button class="btn" id="sLap">ラップ</button>
      </div>
      <div class="laps" id="laps" hidden></div>
    </div>
    <p class="note hide-stage">カウントダウンでは終了1分前と終了時に音声でお知らせします。スペースキーで開始／停止できます。</p>
  </section>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const C=552.9;
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='session-timer-v1';

/* ---------- storage ---------- */
function defaults(){
  return {voice:true,tDir:'down',currentId:null,sessions:[
    {id:uid(),title:'朝の集中タイム',segs:[{id:uid(),label:'準備',sec:300},{id:uid(),label:'ウォームアップ',sec:300},{id:uid(),label:'本番',sec:600}]},
    {id:uid(),title:'プレゼン練習',segs:[{id:uid(),label:'導入',sec:180},{id:uid(),label:'本題',sec:600},{id:uid(),label:'質疑応答',sec:300}]}
  ]};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){S=null}
if(!S||!Array.isArray(S.sessions)||!S.sessions.length)S=defaults();
if(!S.sessions.find(s=>s.id===S.currentId))S.currentId=S.sessions[0].id;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const cur=()=>S.sessions.find(s=>s.id===S.currentId);

/* ---------- format ---------- */
function fmt(ms,ceil){
  let t=ceil?Math.ceil(ms/1000):Math.floor(ms/1000); if(t<0)t=0;
  const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  const p=n=>String(n).padStart(2,'0');
  return h?`${h}:${p(m)}:${p(s)}`:`${p(m)}:${p(s)}`;
}
function spoken(sec){
  const m=Math.floor(sec/60),s=sec%60;
  return (m?m+'分':'')+(s?s+'秒':'')||'0秒';
}
const segName=(seg,i)=>seg.label&&seg.label.trim()?seg.label.trim():`区間${i+1}`;

/* ---------- sound & voice ---------- */
let AC=null;
function ensureAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(freq,count,len){
  if(!AC)return;
  for(let i=0;i<count;i++){
    const t=AC.currentTime+i*(len+0.12);
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+len+0.05);
  }
}
function speak(text){
  if(!S.voice||!('speechSynthesis' in window))return;
  try{const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=1.05;
    const v=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));if(v)u.voice=v;
    speechSynthesis.speak(u);}catch(e){}
}
function announce(kind,text){
  if(kind==='warn')beep(880,2,0.14);
  else if(kind==='end')beep(660,3,0.18);
  else beep(520,1,0.9);
  setTimeout(()=>speak(text),kind==='fin'?900:450);
}
let wake=null;
async function keepAwake(on){
  try{
    if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null);}
    if(!on&&wake){await wake.release();wake=null;}
  }catch(e){wake=null}
}

/* ---------- dial ticks ---------- */
function ticks(el){
  let h='';
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,long=i%5===0;
    const r1=long?74:77,r2=80;
    h+=`<line x1="${100+r1*Math.cos(a)}" y1="${100+r1*Math.sin(a)}" x2="${100+r2*Math.cos(a)}" y2="${100+r2*Math.sin(a)}" stroke-width="${long?1.4:.7}"/>`;}
  el.innerHTML=h;
}
ticks($('#tTicks'));ticks($('#sTicks'));

/* ---------- tabs & voice ---------- */
function showTab(t){
  $('#tabTimer').setAttribute('aria-selected',t==='timer');
  $('#tabSw').setAttribute('aria-selected',t==='sw');
  $('#viewTimer').hidden=t!=='timer';$('#viewSw').hidden=t!=='sw';
  $('#viewTimer').style.display=t==='timer'?'flex':'none';
  $('#viewSw').style.display=t==='sw'?'flex':'none';
  tab=t;
}
let tab='timer';
$('#tabTimer').onclick=()=>showTab('timer');
$('#tabSw').onclick=()=>showTab('sw');
const voiceSw=$('#voiceSw');
function paintVoice(){voiceSw.setAttribute('aria-checked',S.voice)}
voiceSw.onclick=()=>{S.voice=!S.voice;save();paintVoice();if(!S.voice)try{speechSynthesis.cancel()}catch(e){}};
paintVoice();

/* =========================================================
   TIMER (sessions)
   ========================================================= */
const R={segIdx:0,acc:0,startedAt:null,warned:false,done:false};
const running=()=>R.startedAt!==null;
function segElapsed(){return R.acc+(running()?Date.now()-R.startedAt:0)}
function resetRun(){R.segIdx=0;R.acc=0;R.startedAt=null;R.warned=false;R.done=false;keepAwake(false);paintTimerCtrls();}

function setTDir(d){S.tDir=d;save();$('#tDown').setAttribute('aria-selected',d==='down');$('#tUp').setAttribute('aria-selected',d==='up');updateTimer();}
$('#tDown').onclick=()=>setTDir('down');$('#tUp').onclick=()=>setTDir('up');

function paintTimerCtrls(){
  const s=cur(),has=s&&s.segs.length>0;
  $('#tStart').textContent=running()?'一時停止':(R.done?'もう一度':(R.acc>0||R.segIdx>0?'再開':'開始'));
  $('#tStart').disabled=!has;
  $('#tSkip').disabled=!has||R.done;
}
$('#tStart').onclick=()=>{
  ensureAudio();
  const s=cur(); if(!s||!s.segs.length)return;
  if(running()){R.acc=segElapsed();R.startedAt=null;keepAwake(false);}
  else{
    if(R.done)resetRun();
    if(R.segIdx===0&&R.acc===0){const g=s.segs[0];speak(`${s.title||'セッション'}を開始します。${segName(g,0)}、${spoken(g.sec)}`);}
    R.startedAt=Date.now();keepAwake(true);
  }
  paintTimerCtrls();renderTimeline();updateTimer();
};
$('#tReset').onclick=()=>{resetRun();renderTimeline();renderRows();updateTimer();};
$('#tSkip').onclick=()=>{ensureAudio();advance(true);};

function advance(manual){
  const s=cur(); if(!s)return;
  const i=R.segIdx, seg=s.segs[i];
  if(i+1<s.segs.length){
    const nx=s.segs[i+1];
    if(!manual)announce('end',`${segName(seg,i)}終了。次は${segName(nx,i+1)}、${spoken(nx.sec)}です`);
    else if(running())speak(`${segName(nx,i+1)}、${spoken(nx.sec)}`);
    R.segIdx=i+1;R.acc=0;R.warned=false;
    R.startedAt=running()?Date.now():null;
  }else{
    if(!manual)announce('fin',`${s.title||'セッション'}、すべての区間が終了しました`);
    R.done=true;R.startedAt=null;R.acc=seg?seg.sec*1000:0;keepAwake(false);
  }
  paintTimerCtrls();renderTimeline();renderRows();updateTimer();
}

function timerTick(){
  if(!running())return;
  const s=cur(),seg=s&&s.segs[R.segIdx]; if(!seg){resetRun();return;}
  const total=seg.sec*1000,el=segElapsed(),left=total-el;
  if(!R.warned&&total>60000&&left<=60000&&left>0){R.warned=true;announce('warn',`${segName(seg,R.segIdx)}、残り1分です`);}
  if(left<=0)advance(false);
}

function updateTimer(){
  const s=cur(),dial=$('#tDial');
  const segs=s?s.segs:[];
  const totalAll=segs.reduce((a,g)=>a+g.sec,0)*1000;
  if(!segs.length){
    $('#tSegLbl').textContent=s?(s.title||'無題'):'';$('#tBig').textContent='00:00';
    $('#tSub').textContent='区間を追加してください';$('#tPill').innerHTML='';
    $('#tProg').style.strokeDashoffset=C;dial.className='dial';
    $('#tElapsedAll').textContent='00:00';$('#tRemainAll').textContent='00:00';return;
  }
  const i=Math.min(R.segIdx,segs.length-1),seg=segs[i],total=seg.sec*1000;
  const el=Math.min(segElapsed(),total),left=total-el;
  const before=segs.slice(0,i).reduce((a,g)=>a+g.sec,0)*1000;
  $('#tSegLbl').textContent=`${s.title||'無題'} ・ ${segName(seg,i)}`;
  $('#tBig').textContent=R.done?(S.tDir==='down'?'00:00':fmt(total)):(S.tDir==='down'?fmt(left,true):fmt(el));
  $('#tSub').textContent=R.done?'完了':`${i+1} / ${segs.length}　${S.tDir==='down'?'全'+fmt(total):'目標 '+fmt(total)}`;
  const warn=!R.done&&total>60000&&left<=60000;
  $('#tPill').innerHTML=warn?'<span class="pill">残り1分</span>':'';
  dial.className='dial'+(R.done?' fin':warn?' warn':'');
  const frac=R.done?1:el/total;
  $('#tProg').style.strokeDashoffset=S.tDir==='down'?C*frac:C*(1-frac);
  const doneAll=R.done?totalAll:before+el;
  $('#tElapsedAll').textContent=fmt(doneAll);$('#tRemainAll').textContent=fmt(totalAll-doneAll,true);
  const bar=$('#tLine').children[i]; if(bar&&!R.done){const f=bar.querySelector('i');if(f)f.style.width=(frac*100)+'%';}
}

function renderTimeline(){
  const s=cur(),segs=s?s.segs:[];
  $('#tLine').innerHTML=segs.map((g,i)=>{
    const cls=R.done||i<R.segIdx?'past':i===R.segIdx?'cur':'';
    return `<div class="${cls}" style="flex-grow:${g.sec}" title="${esc(segName(g,i))} ${spoken(g.sec)}"><i style="width:${cls==='past'?100:0}%"></i></div>`;
  }).join('');
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- sessions UI ---------- */
function renderChips(){
  $('#chips').innerHTML=S.sessions.map(s=>{
    const tot=s.segs.reduce((a,g)=>a+g.sec,0);
    const parts=s.segs.map(g=>Math.round(g.sec/60*10)/10).join('+');
    return `<button class="chip" data-id="${s.id}" aria-pressed="${s.id===S.currentId}"><span>${esc(s.title||'無題')}</span><em>${parts||'—'}${parts?'分':''} = ${fmt(tot*1000)}</em></button>`;
  }).join('')+`<button class="chip add" id="addSess">＋ 新規</button>`;
}
$('#chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  if(b.id==='addSess'){
    const n={id:uid(),title:'新しいセッション',segs:[{id:uid(),label:'',sec:300},{id:uid(),label:'',sec:300},{id:uid(),label:'',sec:600}]};
    S.sessions.push(n);S.currentId=n.id;
  }else{if(b.dataset.id===S.currentId)return;S.currentId=b.dataset.id;}
  save();resetRun();renderAll();
  if(b.id==='addSess'){const t=$('#sessTitle');t.focus();t.select();}
});

function renderRows(){
  const s=cur();
  $('#sessTitle').value=s?s.title:'';
  if(!s||!s.segs.length){$('#rows').innerHTML='<div class="empty">まだ区間がありません。下のボタンで追加してください。</div>';}
  else $('#rows').innerHTML=s.segs.map((g,i)=>`
    <div class="row${!R.done&&i===R.segIdx&&(running()||R.acc>0)?' cur':''}" data-id="${g.id}">
      <span class="n">${i+1}</span>
      <input class="txt" id="lb-${g.id}" data-f="label" value="${esc(g.label)}" placeholder="区間${i+1}" aria-label="区間${i+1}の名前">
      <span class="unit"><input class="num" id="mn-${g.id}" data-f="min" type="number" min="0" max="999" inputmode="numeric" value="${Math.floor(g.sec/60)}" aria-label="分">分</span>
      <span class="unit"><input class="num" id="sc-${g.id}" data-f="sec" type="number" min="0" max="59" inputmode="numeric" value="${g.sec%60}" aria-label="秒">秒</span>
      <button class="x" data-del="${g.id}" aria-label="区間${i+1}を削除">×</button>
    </div>`).join('');
  paintTotal();
}
function paintTotal(){const s=cur();$('#sessTotal').textContent=fmt((s?s.segs.reduce((a,g)=>a+g.sec,0):0)*1000);}

$('#sessTitle').addEventListener('input',e=>{const s=cur();if(!s)return;s.title=e.target.value;save();renderChips();updateTimer();});
$('#rows').addEventListener('input',e=>{
  const row=e.target.closest('.row');if(!row)return;
  const s=cur(),g=s.segs.find(x=>x.id===row.dataset.id);if(!g)return;
  const f=e.target.dataset.f;
  if(f==='label')g.label=e.target.value;
  else{
    const m=Math.max(0,parseInt(row.querySelector('[data-f=min]').value)||0);
    const sc=Math.min(59,Math.max(0,parseInt(row.querySelector('[data-f=sec]').value)||0));
    g.sec=Math.max(1,m*60+sc);
  }
  save();renderChips();renderTimeline();paintTotal();updateTimer();
});
$('#rows').addEventListener('click',e=>{
  const b=e.target.closest('[data-del]');if(!b)return;
  const s=cur(),idx=s.segs.findIndex(x=>x.id===b.dataset.del);
  s.segs.splice(idx,1);
  if(idx<R.segIdx)R.segIdx--;else if(idx===R.segIdx){R.acc=0;R.warned=false;if(running())R.startedAt=Date.now();}
  if(R.segIdx>=s.segs.length){resetRun();}
  save();renderAll();
});
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
  const s=cur();if(!s)return;s.segs.push({id:uid(),label:'',sec:+b.dataset.add});
  if(R.done){R.done=false;R.segIdx=s.segs.length-1;R.acc=0;R.warned=false;}
  save();renderAll();
});
let armT=null;
$('#delSess').onclick=e=>{
  const b=e.currentTarget;
  if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='もう一度押すと削除';clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove('arm');b.textContent='このセッションを削除'},3000);return;}
  clearTimeout(armT);b.classList.remove('arm');b.textContent='このセッションを削除';
  S.sessions=S.sessions.filter(s=>s.id!==S.currentId);
  if(!S.sessions.length)S.sessions.push({id:uid(),title:'新しいセッション',segs:[]});
  S.currentId=S.sessions[0].id;save();resetRun();renderAll();
};

function renderAll(){renderChips();renderRows();renderTimeline();paintTimerCtrls();updateTimer();}

/* =========================================================
   STOPWATCH
   ========================================================= */
const W={dir:'up',target:300000,acc:0,startedAt:null,laps:[],warned:false,done:false};
const wRun=()=>W.startedAt!==null;
const wEl=()=>W.acc+(wRun()?Date.now()-W.startedAt:0);
function setSDir(d){
  if(wRun())return;
  W.dir=d;resetSw();
  $('#sUp').setAttribute('aria-selected',d==='up');$('#sDown').setAttribute('aria-selected',d==='down');
  $('#sSet').hidden=d!=='down';$('#sLap').hidden=d!=='up';
}
$('#sUp').onclick=()=>setSDir('up');$('#sDown').onclick=()=>setSDir('down');
function readTarget(){
  const m=Math.max(0,parseInt($('#sMin').value)||0),s=Math.min(59,Math.max(0,parseInt($('#sSec').value)||0));
  W.target=Math.max(1,m*60+s)*1000;
}
['#sMin','#sSec'].forEach(id=>$(id).addEventListener('input',()=>{if(!wRun()&&W.acc===0){readTarget();updateSw();}}));
document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{
  if(wRun())return;const v=+b.dataset.sw;$('#sMin').value=Math.floor(v/60);$('#sSec').value=v%60;resetSw();
});
function resetSw(){W.acc=0;W.startedAt=null;W.laps=[];W.warned=false;W.done=false;if(W.dir==='down')readTarget();keepAwake(false);paintSw();updateSw();renderLaps();}
function paintSw(){
  $('#sStart').textContent=wRun()?'一時停止':(W.done?'もう一度':W.acc>0?'再開':'開始');
  $('#sLap').disabled=!wRun();
  const lock=wRun()||W.acc>0;
  $('#sMin').disabled=lock;$('#sSec').disabled=lock;
  document.querySelectorAll('[data-sw]').forEach(b=>b.disabled=wRun());
}
$('#sStart').onclick=()=>{
  ensureAudio();
  if(wRun()){W.acc=wEl();W.startedAt=null;keepAwake(false);}
  else{if(W.done)resetSw();if(W.dir==='down'&&W.acc===0)readTarget();W.startedAt=Date.now();keepAwake(true);}
  paintSw();
};
$('#sReset').onclick=resetSw;
$('#sLap').onclick=()=>{if(!wRun())return;const t=wEl(),prev=W.laps.length?W.laps[W.laps.length-1]:0;W.laps.push(t);renderLaps(t-prev);};
function fmtCs(ms){const cs=Math.floor(ms%1000/10);return fmt(ms)+'.'+String(cs).padStart(2,'0');}
function renderLaps(){
  const el=$('#laps');
  if(!W.laps.length){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  let rows='<div class="hd"><span>No.</span><span>ラップ</span><span>通算</span></div>';
  for(let i=W.laps.length-1;i>=0;i--){const d=W.laps[i]-(i?W.laps[i-1]:0);rows+=`<div><span>${i+1}</span><span>${fmtCs(d)}</span><span>${fmtCs(W.laps[i])}</span></div>`;}
  el.innerHTML=rows;
}
function swTick(){
  if(!wRun()||W.dir!=='down')return;
  const left=W.target-wEl();
  if(!W.warned&&W.target>60000&&left<=60000&&left>0){W.warned=true;announce('warn','残り1分です');}
  if(left<=0){W.acc=W.target;W.startedAt=null;W.done=true;keepAwake(false);announce('fin','時間になりました');paintSw();}
}
function updateSw(){
  const el=wEl(),dial=$('#sDial');
  if(W.dir==='up'){
    const cs=Math.floor(el%1000/10);
    $('#sBig').innerHTML=`${fmt(el)}<small>.${String(cs).padStart(2,'0')}</small>`;
    $('#sLbl').textContent='カウントアップ';
    $('#sSub').textContent=W.laps.length?`ラップ ${W.laps.length}`:'';
    $('#sPill').innerHTML='';dial.className='dial';
    $('#sProg').style.strokeDashoffset=C*(1-(el%60000)/60000);
  }else{
    const left=Math.max(0,W.target-el);
    $('#sBig').textContent=fmt(left,true);
    $('#sLbl').textContent='カウントダウン';
    $('#sSub').textContent=W.done?'終了':`設定 ${fmt(W.target)}`;
    const warn=!W.done&&W.target>60000&&left<=60000;
    $('#sPill').innerHTML=warn?'<span class="pill">残り1分</span>':'';
    dial.className='dial'+(W.done?' fin':warn?' warn':'');
    $('#sProg').style.strokeDashoffset=C*(Math.min(1,el/W.target));
  }
}

/* ---------- size & stage ---------- */
const Z_MIN=0.6,Z_MAX=2.5;
if(typeof S.zoom!=='number')S.zoom=1;
function applyZoom(){
  S.zoom=Math.round(Math.min(Z_MAX,Math.max(Z_MIN,S.zoom))*10)/10;
  document.documentElement.style.setProperty('--z',S.zoom);
  $('#zVal').textContent=Math.round(S.zoom*100)+'%';
  $('#zOut').disabled=S.zoom<=Z_MIN;$('#zIn').disabled=S.zoom>=Z_MAX;save();
}
$('#zIn').onclick=()=>{S.zoom+=0.1;applyZoom();};
$('#zOut').onclick=()=>{S.zoom-=0.1;applyZoom();};
function setStage(on){
  document.body.classList.toggle('stage',on);
  $('#stageBtn').setAttribute('aria-pressed',on);
  $('#stageBtn').textContent=on?'通常表示':'大画面';
  try{
    if(on&&!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
    if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  }catch(e){}
}
$('#stageBtn').onclick=()=>setStage(!document.body.classList.contains('stage'));
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('stage'))setStage(false);});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||e.ctrlKey||e.metaKey)return;
  if(e.key==='+'||e.key==='='){e.preventDefault();$('#zIn').click();}
  else if(e.key==='-'){e.preventDefault();$('#zOut').click();}
  else if(e.key==='f'||e.key==='F'){setStage(!document.body.classList.contains('stage'));}
  else if(e.key==='Escape'&&document.body.classList.contains('stage'))setStage(false);
});
applyZoom();

/* ---------- loop & keys ---------- */
setInterval(()=>{timerTick();swTick();if(running())updateTimer();if(wRun()||W.done)updateSw();},50);
document.addEventListener('keydown',e=>{
  if(e.code!=='Space'||/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName))return;
  e.preventDefault();(tab==='timer'?$('#tStart'):$('#sStart')).click();
});
if('speechSynthesis' in window)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}

setTDir(S.tDir==='up'?'up':'down');
setSDir('up');
renderAll();
})();
</script>

</body>
