<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>都道府県ベースボール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: one narrow column styled like a hand-operated ballpark scoreboard; question card = the pitch; map = the away-game travel board */
:root {
  --board: #173b2c;
  --board-deep: #0f2a1f;
  --board-cell: #0b2118;
  --chalk: #f4f1e3;
  --chalk-dim: #b9c4b5;
  --lamp: #ffd23f;
  --stitch: #e4493e;
  --line: rgba(244, 241, 227, 0.16);
  --dirt: #c98b55;
  --land: #2c5a45;
  --got: #6f8f5a;
  --f-display: "BIZ UDPGothic", "BIZ UDPゴシック", "UD デジタル 教科書体 NK-B", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "BIZ UDPGothic", "BIZ UDPゴシック", "UD デジタル 教科書体 NK-R", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--board-deep);
  color: var(--chalk);
  font-family: var(--f-body);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 6vw, 30px); line-height: 1.2; margin: 0; letter-spacing: .02em; text-wrap: balance; }
h1 small { display: block; font-family: var(--f-body); font-size: 13px; font-weight: 700; color: var(--chalk-dim); letter-spacing: .08em; }
h2.sec { font-family: var(--f-display); font-weight: 700; font-size: 20px; margin: 0; }
.muted { color: var(--chalk-dim); font-size: 14px; margin: 0; }
.player-chip { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.player-chip .who { background: var(--chalk); color: var(--board-deep); border-radius: 999px; padding: 3px 12px; }

button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.ghost { font-weight: 700; background: transparent; color: var(--chalk); border: 2px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.ghost.small { font-size: 13px; padding: 4px 10px; border-radius: 999px; }
.primary { font-family: var(--f-display); font-size: 18px; background: var(--chalk); color: var(--board-deep); border: none; border-radius: 10px; padding: 12px 16px; box-shadow: 0 4px 0 var(--dirt); }
.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--dirt); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.tabs { display: flex; gap: 6px; }
.tab { font-weight: 700; font-size: 14px; background: transparent; color: var(--chalk-dim); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; }
.tab[aria-selected="true"] { background: var(--chalk); color: var(--board-deep); border-color: var(--chalk); }

/* save slots */
.slots { display: flex; flex-direction: column; gap: 10px; }
.slot { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; background: var(--board); border: 2px solid var(--line); border-radius: 12px; padding: 12px; }
.slot .no { font-family: var(--f-display); font-size: 22px; text-align: center; color: var(--lamp); }
.slot .info { min-width: 0; }
.slot .nm { font-weight: 700; font-size: 18px; overflow-wrap: anywhere; }
.slot .meta { font-size: 13px; color: var(--chalk-dim); }
.slot input { font: inherit; font-weight: 700; width: 100%; background: var(--board-cell); color: var(--chalk); border: 2px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.slot .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 440px) { .slot { grid-template-columns: 36px 1fr; } .slot .acts { grid-column: 1 / -1; justify-content: flex-start; } }

/* mode select */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.mode { text-align: left; background: var(--chalk); color: var(--board-deep); border: none; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 4px 0 var(--dirt); transition: transform .1s; }
.mode:hover { transform: translateY(-2px); }
.mode:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--dirt); }
.mode b { font-family: var(--f-display); font-weight: 700; font-size: 19px; }
.mode span { font-size: 13px; font-weight: 700; opacity: .75; }
.mode .best { font-size: 12px; font-weight: 700; color: var(--stitch); opacity: 1; }
.mode.trip { grid-column: 1 / -1; background: var(--lamp); }
.types { display: flex; gap: 8px; flex-wrap: wrap; }
.type { font-weight: 700; font-size: 14px; background: transparent; color: var(--chalk-dim); border: 2px dashed var(--line); border-radius: 999px; padding: 5px 14px; }
.type[aria-pressed="true"] { background: var(--stitch); color: var(--chalk); border: 2px solid var(--stitch); }

/* scoreboard */
.board { background: var(--board); border: 3px solid var(--chalk); border-radius: 6px; padding: 12px; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
.board-scroll { overflow-x: auto; }
.board table { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 360px; }
.board th { font-family: var(--f-display); font-weight: 700; font-size: 13px; color: var(--chalk-dim); text-align: center; padding: 0; }
.board td { background: var(--board-cell); font-family: var(--f-display); font-size: 22px; text-align: center; height: 42px; width: 9%; color: var(--chalk); border-radius: 3px; font-variant-numeric: tabular-nums; }
.board td.name { width: auto; font-size: 14px; text-align: left; padding-inline: 8px; background: transparent; white-space: nowrap; max-width: 7em; overflow: hidden; text-overflow: ellipsis; }
.board td.now { box-shadow: inset 0 0 0 2px var(--lamp); }
.board td.hit { color: var(--lamp); }
.board td.out { color: var(--chalk-dim); }
.board td.total { background: var(--chalk); color: var(--board-deep); width: 12%; }
.board-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--chalk-dim); gap: 10px; flex-wrap: wrap; }
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tally div { background: var(--board-cell); border-radius: 4px; text-align: center; padding: 6px 4px; }
.tally b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.2; color: var(--lamp); font-variant-numeric: tabular-nums; }
.tally span { font-size: 12px; color: var(--chalk-dim); font-weight: 700; }
.trip-bar { height: 12px; background: var(--board-cell); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.trip-bar i { display: block; height: 100%; background: var(--lamp); }
.trip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.trip-head b { font-family: var(--f-display); font-weight: 700; font-size: 22px; }

/* pitch card */
.pitch { background: var(--chalk); color: var(--board-deep); border-radius: 12px; padding: 18px 18px 16px; position: relative; overflow: hidden; }
.pitch::before, .pitch::after { content: ""; position: absolute; width: 140px; height: 140px; border-radius: 50%; border: 2px dashed var(--stitch); opacity: .35; pointer-events: none; }
.pitch::before { right: -100px; top: -40px; }
.pitch::after { left: -110px; bottom: -70px; }
.pitch .inning { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--stitch); }
.tag { display: inline-block; font-size: 12px; font-weight: 700; background: var(--board); color: var(--chalk); border-radius: 4px; padding: 1px 8px; margin-left: 6px; letter-spacing: .05em; }
.tag.red { background: var(--stitch); }
.pitch .subject { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 7vw, 34px); line-height: 1.25; margin: 8px 0 0; text-wrap: balance; }
.pitch .reading { font-size: 14px; font-weight: 700; opacity: .7; }
.pitch .ask { font-size: 17px; font-weight: 700; margin: 8px 0 0; }
.hint-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.hint-btn { font-size: 13px; font-weight: 700; background: transparent; border: 2px solid var(--board); color: var(--board); border-radius: 999px; padding: 2px 12px; }
.hint { font-size: 14px; font-weight: 700; color: var(--board); }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { background: var(--board); color: var(--chalk); border: 2px solid var(--line); border-radius: 10px; padding: 12px 8px; min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.choice:hover:not(:disabled) { border-color: var(--chalk); }
.choice b { font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.3; }
.choice span { font-size: 12px; font-weight: 700; color: var(--chalk-dim); }
.choice:disabled { cursor: default; opacity: .45; }
.choice.right { opacity: 1; background: var(--lamp); color: var(--board-deep); border-color: var(--lamp); }
.choice.right span { color: var(--board-deep); }
.choice.wrong { opacity: 1; border-color: var(--stitch); background: #3a2420; }
@media (max-width: 380px) { .choice b { font-size: 19px; } }

.call { border-radius: 12px; padding: 14px 16px; border: 2px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.call.hit { border-color: var(--lamp); }
.call h2 { font-family: var(--f-display); font-weight: 700; font-size: 26px; margin: 0; line-height: 1.2; }
.call.hit h2 { color: var(--lamp); }
.call p { margin: 0; font-size: 15px; }
.call .fact { color: var(--chalk-dim); font-size: 14px; }
.call .mlb { font-size: 14px; background: var(--board-cell); border-radius: 8px; padding: 6px 10px; }
.call .mlb b { color: var(--lamp); }
.meisan { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.meisan em { font-style: normal; font-weight: 700; background: var(--chalk); color: var(--board-deep); border-radius: 999px; padding: 1px 10px; }
.rare { display: inline-block; font-size: 11px; font-weight: 700; background: var(--stitch); color: var(--chalk); border-radius: 4px; padding: 0 7px; margin-right: 6px; letter-spacing: .05em; }

/* map */
.map { background: var(--board-cell); border-radius: 10px; padding: 6px; }
.map svg { display: block; width: 100%; height: auto; }
.map-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--chalk-dim); padding: 4px 4px 0; }
.map path { fill: var(--land); stroke: var(--board-deep); stroke-width: 1.2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.map path.got { fill: var(--got); }
.map path.done { fill: var(--dirt); }
.map path.on { fill: var(--lamp); }
.map path.miss { fill: var(--stitch); }
.map .inset { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; }
.map .ring { fill: none; stroke: var(--lamp); stroke-width: 3; vector-effect: non-scaling-stroke; }
.map .ring.pulse { animation: pulse 1.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.map text { font-family: var(--f-body); font-weight: 700; fill: var(--chalk); stroke: var(--board-deep); stroke-width: 5px; paint-order: stroke; vector-effect: non-scaling-stroke; }
.modes.small { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.modes.small .mode b { font-size: 17px; }
@keyframes pulse { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

.result { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; padding-block: 8px; }
.result .big { font-family: var(--f-display); font-size: clamp(56px, 18vw, 88px); line-height: 1; color: var(--lamp); }
.result h2 { font-family: var(--f-display); font-weight: 700; font-size: 24px; margin: 0; }
.result p { margin: 0; color: var(--chalk-dim); max-width: 32em; }
.result .row { justify-content: center; }

/* stamp book */
.book-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.book-head .count { font-family: var(--f-display); color: var(--lamp); font-size: 20px; font-variant-numeric: tabular-nums; }
.region { display: flex; flex-direction: column; gap: 6px; }
.region h3 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--chalk-dim); }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.cell { background: var(--board); border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px; text-align: center; position: relative; display: flex; flex-direction: column; justify-content: center; }
.cell b { font-size: 15px; font-weight: 700; line-height: 1.3; }
.cell span { font-size: 10px; color: var(--chalk-dim); line-height: 1.4; }
.cell.got { background: var(--chalk); color: var(--board-deep); border-color: var(--chalk); }
.cell.got span { color: var(--board-deep); opacity: .65; }
.cell.got::after { content: ""; position: absolute; top: -6px; right: -4px; width: 22px; height: 22px; border-radius: 50%;
  background: radial-gradient(circle at 0 50%, transparent 8px, var(--stitch) 8px, var(--stitch) 9px, transparent 9px), radial-gradient(circle at 100% 50%, transparent 8px, var(--stitch) 8px, var(--stitch) 9px, transparent 9px), #fff;
  border: 1px solid #d8d3c0; transform: rotate(-20deg); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--chalk-dim); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }


.primary.sm { font-size: 15px; padding: 8px 14px; }
.ghost.danger { border-color: var(--stitch); }
.slot .nm.dim { color: var(--chalk-dim); }
.big small { font-size: .4em; color: var(--chalk-dim); }
.choice b.long { font-size: 16px; }
h2.sec .tag { vertical-align: middle; font-family: var(--f-body); }
select { font: inherit; font-weight: 700; background: var(--board); color: var(--chalk); border: 2px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.switch-row { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; background: var(--board); color: var(--chalk); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; }
.switch i { width: 38px; height: 22px; border-radius: 999px; background: var(--board-cell); position: relative; transition: background .15s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--chalk-dim); transition: transform .15s, background .15s; }
.switch[aria-checked="true"] i { background: var(--stitch); }
.switch[aria-checked="true"] i::after { transform: translateX(16px); background: var(--chalk); }
.practice { border-top: 2px dashed var(--line); padding-top: 14px; }
.map.tap path { cursor: pointer; }
.map.tap path:hover { fill: #3f7a5e; }
.map.tap path:active { fill: var(--lamp); }
.call .think { font-size: 13px; color: var(--chalk-dim); }
.meisan .cap { margin-left: auto; color: var(--chalk-dim); }
.timebox { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--board); border: 2px solid var(--line); border-radius: 12px; padding: 10px 18px; }
.timebox span { font-size: 13px; color: var(--chalk-dim); font-weight: 700; }
.timebox b { font-size: 30px; color: var(--lamp); font-variant-numeric: tabular-nums; }
.timebox em { font-style: normal; font-weight: 700; }
.spark { margin: 0; width: 100%; max-width: 420px; }
.spark svg { width: 100%; height: auto; display: block; }
.spark .grid { stroke: var(--line); stroke-width: 1; }
.spark text { font-size: 11px; fill: var(--chalk-dim); font-family: var(--f-body); }
.spark .ln { fill: none; stroke: var(--chalk); stroke-width: 2; stroke-linejoin: round; }
.spark .dot { fill: var(--chalk); }
.spark .last { fill: var(--stitch); }
.spark .best { fill: var(--lamp); }
.spark figcaption { font-size: 12px; color: var(--chalk-dim); text-align: center; }
.rec { background: var(--board); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.rec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rec-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.rec-nums div { background: var(--board-cell); border-radius: 6px; padding: 6px; text-align: center; }
.rec-nums span { display: block; font-size: 12px; color: var(--chalk-dim); }
.rec-nums b { font-variant-numeric: tabular-nums; }
.lamp { color: var(--lamp); }
.grow { margin: 0; font-weight: 700; color: var(--lamp); }
.empty { background: var(--board); border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; }
.subtabs { display: flex; gap: 8px; flex-wrap: wrap; }
.school-block h3 { margin: 6px 0; font-size: 17px; }
.tbl { overflow-x: auto; background: var(--board); border-radius: 10px; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; color: var(--chalk-dim); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl td small { display: block; font-size: 11px; color: var(--chalk-dim); }
.tbl .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .bar { display: inline-block; width: 60px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--lamp) var(--w), var(--board-cell) var(--w)); margin-right: 8px; vertical-align: middle; }
.shape-box { background: var(--board-cell); border-radius: 12px; padding: 14px; display: flex; justify-content: center; }
.shape { display: block; width: 100%; max-width: 280px; height: auto; aspect-ratio: 1; }
.shape path { fill: var(--lamp); stroke: var(--board-deep); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.shape-choice { min-height: 0; padding: 10px; gap: 4px; }
.shape-choice .shape { max-width: 130px; }
.shape-choice .shape path { fill: var(--chalk); }
.choice.right.shape-choice .shape path { fill: var(--board-deep); }
.note { font-size: 12px; color: var(--chalk-dim); margin: 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.94); opacity: .4; } to { transform: scale(1); opacity: 1; } }
.call, .result { animation: pop .18s ease-out; }
</style>

const SCHOOL_FACT = {};
for (const [pref, list] of Object.entries(SCHOOLS_RAW)) for (const [name, yomi, fact, rare] of list) SCHOOL_FACT[SCHOOL_ALIAS[name] || name] = { pref, name, yomi, fact, rare };

function schoolFact(s) {
  const rec = s.apps ? `夏の甲子園に${s.apps}回出場${s.sw ? `、夏の優勝${s.sw}回` : ""}${s.spw ? `、春の優勝${s.spw}回` : ""}。` : "";

const opts4 = (answer, pool, bad = []) => shuffle([answer, ...shuffle([...new Set(pool)].filter(x => x !== answer && !bad.includes(x))).slice(0, 3)]);

function careerQs(c, prefOnly) {

function questionsFor(pref, types, prefOnly = false) {
  const out = [];
  const p = P[pref];
  if (types.includes("team")) out.push(...TEAMS.filter(q => q.pref === pref));
  if (types.includes("player")) out.push(...PLAYERS.filter(q => q.pref === pref));
  if (types.includes("mlb")) for (const c of CAREER.filter(c => c.pref === pref)) out.push(...careerQs(c, prefOnly));
  if (types.includes("school")) {
    const list = SCHOOLS.filter(s => s.pref === pref);
    const famous = list.filter(s => SCHOOL_FACT[s.name]);
    for (const s of shuffle(famous).concat(shuffle(list.filter(s => !SCHOOL_FACT[s.name])).slice(0, 2))) {
      const f = schoolFact(s);
      out.push({ kind: "高校野球", name: s.name + "高校", yomi: s.yomi, pref, fact: f.text, rare: f.rare });
    }
    const ranked = list.filter(s => s.apps).sort((a, b) => b.apps - a.apps);
    if (!prefOnly && ranked.length >= 4 && ranked[0].apps > ranked[1].apps) {
      const top = ranked[0];
      out.push({ kind: "甲子園記録", name: `${pref}の高校`, yomi: "", pref, ask: `${pref}で、夏の甲子園にいちばん多く出ている高校は？`,
        answer: top.name, options: shuffle([top.name, ...shuffle(ranked.slice(1)).slice(0, 3).map(s => s.name)]),
        fact: `${top.name}は夏の甲子園に${top.apps}回出場。${pref}でいちばん多いよ。` });
    }
  }
  if (types.includes("meisan") && MEISAN[pref]) {
    out.push({ kind: "名産", name: MEISAN[pref].map(m => `「${m}」`).join(""), yomi: "", pref, fact: `${pref}の名産だよ。${regionLabel(p.region)}にある${endKind(pref)}だね。` });
  }
  if (types.includes("blank")) out.push({ kind: "白地図", name: "", yomi: "", pref, blank: true, ask: "黄色の都道府県は どこ？", fact: `${pref}は${regionLabel(p.region)}にあるよ。県庁所在地は${CAPITALS[pref][0]}。` });
  if (types.includes("capital")) {
    const [cap, cy] = CAPITALS[pref];
    const same = cap.replace(/[市（].*$/, "") === pref.replace(/[都道府県]$/, "");
    if (prefOnly) out.push({ kind: "県庁所在地", name: cap, yomi: cy, pref, ask: "ここが県庁所在地なのは どこの都道府県？", fact: `${pref}の県庁所在地は${cap}（${cy}）。` });
    else out.push({ kind: "県庁所在地", name: pref, yomi: p.yomi, pref, ask: "この都道府県の県庁所在地は？", answer: cap,
      options: opts4(cap, Object.values(CAPITALS).map(c => c[0])), fact: `${pref}の県庁所在地は${cap}（${cy}）。${same ? "県の名前と同じだね。" : "県の名前とちがうから注意！"}` });
  }
  if (types.includes("yomi")) {
    if (prefOnly) out.push({ kind: "読みがな", noYomi: true, name: p.yomi, yomi: "", pref, ask: "この読み方の都道府県を 漢字でえらぼう", fact: `${p.yomi}は「${pref}」と書くよ。` });
    else out.push({ kind: "読みがな", name: pref, yomi: "", pref, ask: "この都道府県の読み方は？", answer: p.yomi,
      options: opts4(p.yomi, PREFS.filter(x => x.region === p.region || Math.random() < .2).map(x => x.yomi)), fact: `${pref}は「${p.yomi}」と読むよ。` });
  }
  if (types.includes("shape")) out.push({ kind: "形クイズ", name: "", yomi: "", pref, shape: true, ask: "この形の都道府県は どこ？", fact: `${pref}の形をおぼえよう。${regionLabel(p.region)}にあるよ。` });
  if (types.includes("shapepick")) out.push({ kind: "形えらび", name: pref, yomi: p.yomi, pref, shapePick: true, ask: "この都道府県の形は どれ？", fact: `これが${pref}の形。${regionLabel(p.region)}にあるよ。` });
  if (types.includes("region") && !prefOnly) {
    out.push({ kind: "何地方？", name: pref, yomi: p.yomi, pref, ask: "この都道府県は 何地方？", answer: regionLabel(p.region),
      options: opts4(regionLabel(p.region), REGION_NAMES.map(regionLabel)), fact: `${pref}は${regionLabel(p.region)}だよ。` });
  }
  return out;
}

function makeChoices(correct, pool) {
  const c = P[correct];
  let others;
  const region = PREFS.filter(p => p.region === c.region).map(p => p.name);
  if (pool && pool.length >= 4) others = shuffle(pool.filter(n => n !== correct)).slice(0, 3);
  else if (region.length >= 4) {
    others = shuffle(region.filter(n => n !== correct)).slice(0, 2);
    others.push(pick(PREFS.map(p => p.name).filter(n => n !== correct && !others.includes(n))));
  } else {
    const near = shuffle(PREFS.filter(p => (p.region === "東北地方" || p.region === c.region) && p.name !== correct)).slice(0, 3).map(p => p.name);
    others = near;
  }
  return shuffle([correct, ...others]).map(n => P[n]);
}

// ---------- 地図 ----------
const FULL = [-16, -16, MAP.w + 32, MAP.h + 32];
const BOX = {};
for (const [n, d] of Object.entries(MAP.paths)) {
  const nums = d.match(/-?[\d.]+/g).map(Number);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < nums.length; i += 2) { x0 = Math.min(x0, nums[i]); x1 = Math.max(x1, nums[i]); y0 = Math.min(y0, nums[i + 1]); y1 = Math.max(y1, nums[i + 1]); }
  BOX[n] = [x0, y0, x1, y1];
}
function zoomBox(pref) {
  if (pref === "沖縄県") { const [a, b, c, d] = MAP.inset; return fitAspect([a, b, c, d], 0.04); }
  const reg = P[pref].region;
  const names = PREFS.filter(p => p.region === reg && p.name !== "沖縄県").map(p => p.name);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of names) { const [a, b, c, d] = BOX[n]; x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); }
  if (reg === "九州地方") y1 = Math.min(y1, BOX["鹿児島県"][1] + (BOX["宮崎県"][3] - BOX["宮崎県"][1]) * 1.25);
  return fitAspect([x0, y0, x1, y1], 0.12);
}
function fitAspect([x0, y0, x1, y1], padFrac) {
  let w = x1 - x0, h = y1 - y0;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  w *= 1 + padFrac * 2; h *= 1 + padFrac * 2;
  const ar = FULL[2] / FULL[3];
  if (w / h > ar) h = w / ar; else w = h * ar;
  if (w < 300) { w = 300; h = w / ar; }
  return [cx - w / 2, cy - h / 2, w, h];
}

// zoom: 全国→地方へアニメーション / fixed: はじめから地方 / tap: タップで答える
function mapSvg({ got = [], done = [], on = null, miss = null, label = true, zoom = false, fixed = null, tap = false, ring = true } = {}) {
  const target = fixed ? zoomBox(fixed) : zoom && on ? zoomBox(on) : FULL;
  const tw = target[2];
  const paths = Object.entries(MAP.paths).map(([n, d]) => {
    const cls = n === on ? "on" : n === miss ? "miss" : done.includes(n) ? "done" : got.includes(n) ? "got" : "";
    return `<path d="${d}" class="${cls}"${tap ? ` data-pref="${n}"` : ""}>${tap ? "" : `<title>${n}</title>`}</path>`;
  }).join("");
  const [ix0, iy0, ix1, iy1] = MAP.inset;
  const r = tw * 0.028, fs = tw * 0.055;
  let marks = "";
  for (const [n, pulse] of [[miss, false], [on, true]]) {
    if (!n || !ring) continue;
    const [x, y] = MAP.cen[n];
    marks += `<circle class="ring" cx="${x}" cy="${y}" r="${r}" style="stroke:${n === miss ? "var(--stitch)" : "var(--lamp)"}"/>`;
    if (pulse) marks += `<circle class="ring pulse" cx="${x}" cy="${y}" r="${r}"/>`;
    if (label) {
      const right = x < target[0] + target[2] * 0.6;
      marks += `<text x="${right ? x + r * 1.5 : x - r * 1.5}" y="${y + fs * 0.35}" text-anchor="${right ? "start" : "end"}" font-size="${fs}">${n}</text>`;
    }
  }
  const zoomAttr = zoom && on && !fixed ? ` data-zoom="${target.map(v => v.toFixed(1)).join(" ")}"` : "";
  const vb = (fixed ? target : FULL).map(v => v.toFixed(1)).join(" ");
  return `<div class="map${tap ? " tap" : ""}"><svg viewBox="${vb}"${zoomAttr} role="img" aria-label="日本地図">
    <rect class="inset" x="${ix0}" y="${iy0}" width="${ix1 - ix0}" height="${iy1 - iy0}" rx="10"/>
    ${paths}${marks}
  </svg><div class="map-foot"><span>地図：地球地図日本（国土地理院）をもとに作成</span>${zoomAttr ? `<button class="ghost small" data-zoomtoggle>全国を見る</button>` : ""}</div></div>`;
}

// 1つの都道府県の形だけを大きく（形クイズ用のくわしい輪郭）
function shapeSvg(pref, cls = "") {
  const [w, hgt, d] = SHAPES[pref];
  const s = Math.max(w, hgt) * 1.1;
  const vb = [w / 2 - s / 2, hgt / 2 - s / 2, s, s].map(v => v.toFixed(0)).join(" ");
  return `<svg class="shape ${cls}" viewBox="${vb}" role="img" aria-label="都道府県の形"><path d="${d}"/></svg>`;
}

function animateMaps(root) {
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  root.querySelectorAll("svg[data-zoom]").forEach(svg => {
    const to = svg.dataset.zoom.split(" ").map(Number);
    const btn = svg.parentElement.querySelector("[data-zoomtoggle]");
    let cur = FULL.slice(), zoomed = false, raf = 0;
    const set = v => { cur = v; svg.setAttribute("viewBox", v.map(n => n.toFixed(1)).join(" ")); };
    const go = (target, ms) => {
      cancelAnimationFrame(raf);
      if (reduce || ms === 0) return set(target);
      const from = cur.slice(), t0 = performance.now();
      const step = now => {
        const t = Math.min(1, (now - t0) / ms), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        set(from.map((f, i) => f + (target[i] - f) * e));
        if (t < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    };
    const zoomIn = () => { zoomed = true; if (btn) btn.textContent = "全国を見る"; go(to, 900); };
    const zoomOut = () => { zoomed = false; if (btn) btn.textContent = "ちかくで見る"; go(FULL, 700); };
    if (btn) btn.onclick = () => zoomed ? zoomOut() : zoomIn();
    setTimeout(zoomIn, reduce ? 0 : 450);
  });
}

            <div class="acts"><button class="ghost small" data-new="${i}">名前を入れる</button></div></div>`;
        return `
          <div class="slot"><div class="no">${i + 1}</div>
            <div class="info"><div class="nm">${esc(s.name)}</div>
              <div class="meta">スタンプ ${s.stamps.length}/47 ・ 日本一周 ${s.trip}/47${s.tripClears ? `（${s.tripClears}周クリア）` : ""}</div></div>
            <div class="acts"><button class="primary sm" data-play="${i}">あそぶ</button>
              <button class="ghost small" data-new="${i}">名前</button><button class="ghost small" data-del="${i}">けす</button></div></div>`;
      }).join("")}
    </div>`;
  app.querySelectorAll("[data-new]").forEach(b => b.onclick = () => { slotEdit = +b.dataset.new; slotDelete = null; render(); const el = document.getElementById("name-" + slotEdit); el && el.focus(); });
  app.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => { slotEdit = slotDelete = null; render(); });
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { slotDelete = +b.dataset.del; slotEdit = null; render(); });
  app.querySelectorAll("[data-del-yes]").forEach(b => b.onclick = () => { save.slots[+b.dataset.delYes] = null; slotDelete = null; persist(); render(); });
  app.querySelectorAll("[data-play]").forEach(b => b.onclick = () => { save.current = +b.dataset.play; view = "home"; persist(); render(); });
  const ok = i => {
    const v = document.getElementById("name-" + i).value.trim().slice(0, 10);
    if (!v) { document.getElementById("name-" + i).focus(); return; }
    if (save.slots[i]) save.slots[i].name = v; else save.slots[i] = newSlot(v);
    slotEdit = null; save.current = i; view = "home"; persist(); render();
  };
  app.querySelectorAll("[data-ok]").forEach(b => b.onclick = () => ok(+b.dataset.ok));
  const inp = slotEdit != null && document.getElementById("name-" + slotEdit);
  if (inp) inp.onkeydown = e => { if (e.key === "Enter") ok(slotEdit); };
}

  const best = id => s.best[id] != null ? `<span class="best">ベスト ${s.best[id]}点</span>` : "";
  const shown = TYPES.filter(t => s.ball ? t.group !== "plain" : t.group !== "ball");
  const act = activeTypes(s);
  app.innerHTML = `
    <div class="switch-row">

        <button class="mode" data-mode="free"><b>フリーモード</b><span>全国から好きなだけ</span>${s.bestStreak ? `<span class="best">さいこう ${s.bestStreak}れんぞく</span>` : ""}</button>
        <button class="mode" data-mode="east"><b>東日本モード</b><span>北海道・東北・関東・中部</span>${best("east")}</button>
        <button class="mode" data-mode="west"><b>西日本モード</b><span>近畿・中国・四国・九州・沖縄</span>${best("west")}</button>
      </div>
    </div>
    <div class="stack">
      <h2 class="sec">地方モード</h2>
      <p class="muted">えらんだ地方だけで${s.ball ? "9回勝負" : "9問"}。こたえの選択肢もその地方から出るよ。</p>
      <div class="modes small">${REGION_MODES.map(id => `<button class="mode" data-mode="${id}"><b>${AREAS[id].label}</b><span>${AREAS[id].desc}</span>${best(id)}</button>`).join("")}</div>
    </div>
    <div class="stack">
      <h2 class="sec">クイズのしゅるい</h2>
      <p class="muted">上のモードで出す問題をえらんでね（いくつでもOK）。</p>
      <div class="types">${shown.map(t => `<button class="type" aria-pressed="${act.includes(t.id)}" data-type="${t.id}">${t.label}</button>`).join("")}</div>
      <p class="muted" id="type-note"></p>
    </div>
    <div class="stack practice">
      <h2 class="sec">れんしゅうモード <span class="tag">野球なし・10問・タイムをはかる</span></h2>
      <div class="row"><label class="muted" for="scope">はんい</label>
        <select id="scope">${[["all", "全国"], ...REGION_MODES.map(id => [id, AREAS[id].label])].map(([id, l]) => `<option value="${id}" ${s.scope === id ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="modes small">${PRACTICE.map(p => {
        const rec = (s.records[`p:${p.id}:${s.scope}`] || []);
        const bt = rec.length ? Math.min(...rec.map(r => r.ms)) : null;

      s[key] = s[key].filter(t => t !== id);

// ---------- ゲーム ----------
const isNine = () => game && game.mode !== "free" && game.mode !== "trip";
const total = () => game.mode === "practice" ? PRACTICE_N : 9;
const ballOn = () => me().ball && game.mode !== "practice";

function startGame(mode, practiceId) {
  const s = me();
  game = { mode, practiceId, i: 0, results: [], ok: 0, n: 0, streak: 0, used: [], over: false, thinkMs: 0 };
  if (mode === "practice") {
    game.pool = s.scope === "all" ? null : areaPrefs(s.scope);
    game.types = PRACTICE.find(p => p.id === practiceId).types;
    game.key = `p:${practiceId}:${s.scope}`;
    game.label = `${PRACTICE.find(p => p.id === practiceId).label}（${s.scope === "all" ? "全国" : AREAS[s.scope].label}）`;
  } else {
    game.pool = mode === "trip" || mode === "free" ? null : areaPrefs(mode);
    game.types = activeTypes(s);
    game.key = mode;
    game.label = mode === "trip" ? "日本一周" : AREAS[mode].label;
  }
  nextQuestion();
}

function nextQuestion() {
  const s = me();
  let pref;
  if (game.mode === "trip") {
    game.tripIdx = s.trip;
    pref = PREFS[s.trip].name;
  } else {
    const pool = game.pool || PREFS.map(p => p.name);
    const avail = pool.filter(n => game.types.includes("tap") || questionsFor(n, game.types).length);
    const fresh = avail.filter(n => !game.used.includes(n));
    pref = pick(fresh.length ? fresh : avail);
    game.used.push(pref);
    if (game.used.length >= avail.length) game.used = [];
  }
  const prefOnly = game.mode === "trip";
  let qs = questionsFor(pref, game.types.filter(t => t !== "tap"), prefOnly);
  if (game.types.includes("tap")) qs.push({ kind: "地図タップ", name: pref, yomi: P[pref].yomi, pref, tap: true, ask: `この都道府県を 地図でタップしよう（${regionLabel(P[pref].region)}）`, fact: `${pref}は${regionLabel(P[pref].region)}にあるよ。` });
  if (!qs.length) qs = questionsFor(pref, ["meisan"], prefOnly);
  game.q = { ...pick(qs) };
  game.q.answer = game.q.answer || pref;
  const areaPool = game.mode === "free" || game.mode === "trip" ? null : game.pool;
  game.choices = game.q.tap ? [] : game.q.options ? game.q.options.map(n => ({ name: n, yomi: "" })) : makeChoices(pref, areaPool);
  game.answered = false;
  game.picked = null;
  game.qStart = null;
  render();
  game.qStart = performance.now();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function boardHtml() {
  const s = me();
  const ball = ballOn();
  if (game.mode === "trip") {
    const cur = PREFS[game.tripIdx];
    return `<div class="board">
      <div class="trip-head"><b>日本一周 ${s.trip}/47</b><span class="muted">いま：${game.answered && game.lastOk ? cur.name : "？？？"}（${regionLabel(cur.region)}）</span></div>
      <div class="trip-bar"><i style="width:${(s.trip / 47 * 100).toFixed(1)}%"></i></div>
      <div class="board-meta"><span>せいかいすると次の都道府県へ進むよ。まちがえたら同じ場所でもう一回！</span></div>
    </div>`;
  }
  if (game.mode === "free") {
    return `<div class="board"><div class="tally">
      <div><b>${game.ok}</b><span>せいかい</span></div>
      <div><b>${game.n}</b><span>もんだい</span></div>
      <div><b>${game.streak}</b><span>れんぞく</span></div>
    </div><div class="board-meta"><span>フリーモード：全国から出るよ</span><span>さいこう ${s.bestStreak}れんぞく</span></div></div>`;
  }
  const N = total();
  const head = ["", ...Array.from({ length: N }, (_, i) => i + 1), ball ? "R" : "計"].map(h => `<th>${h}</th>`).join("");
  const cells = Array.from({ length: N }, (_, i) => {
    const r = game.results[i];
    const now = !game.over && i === game.i ? " now" : "";
    if (r === true) return `<td class="hit${now}">${ball ? 1 : "○"}</td>`;
    if (r === false) return `<td class="out${now}">${ball ? 0 : "×"}</td>`;
    return `<td class="${now.trim()}"></td>`;
  }).join("");
  const sc = game.results.filter(Boolean).length;
  return `<div class="board"><div class="board-scroll"><table>
    <thead><tr>${head}</tr></thead>
    <tbody><tr><td class="name">${esc(s.name)}</td>${cells}<td class="total">${sc}</td></tr></tbody>
  </table></div><div class="board-meta"><span>${esc(game.label)}</span><span>考えた時間 ${fmtTime(game.thinkMs)}</span></div></div>`;
}

function renderGame() {
  if (game.over) return renderResult();
  const s = me();
  const q = game.q;
  const ball = ballOn();
  const inningLabel = game.mode === "trip" ? `${game.tripIdx + 1}こめ` : game.mode === "free" ? `${game.n + (game.answered ? 0 : 1)}問め` : ball ? `${game.i + 1}回` : `${game.i + 1}問め`;
  let html = boardHtml();
  if (game.mode === "trip" && !game.answered && !q.blank && !q.tap) html += mapSvg({ done: PREFS.slice(0, game.tripIdx).map(p => p.name), label: false });
  const subject = q.shape ? `<div class="shape-box">${shapeSvg(q.pref)}</div>` : q.blank
    ? mapSvg({ on: game.answered ? null : q.pref, fixed: q.pref, label: false, ring: false })
    : `<p class="subject">${esc(q.name)}</p>${q.yomi ? `<div class="reading">${esc(q.yomi)}</div>` : ""}`;
  html += `
    <div class="pitch">
      <div><span class="inning">${inningLabel}</span><span class="tag">${q.kind}</span>${q.sub ? `<span class="tag red">${esc(q.sub)}</span>` : ""}</div>
      ${q.blank || q.shape ? "" : subject}
      <p class="ask">${q.ask || ASK[q.kind]}</p>
      ${q.blank || q.tap ? "" : `<div class="hint-row"><button class="hint-btn" id="hint-btn">ヒントを見る</button><span class="hint" id="hint" hidden>${regionLabel(P[q.pref].region)}だよ</span></div>`}
    </div>`;
  if ((q.blank || q.shape) && !game.answered) html += subject;
  if (q.tap) {
    if (!game.answered) html += mapSvg({ fixed: q.pref, tap: true, label: false, ring: false });
  } else {
    html += `<div class="choices">
      ${game.choices.map((c, k) => {
        let cls = "";
        if (game.answered) cls = c.name === q.answer ? "right" : k === game.picked ? "wrong" : "";
        if (q.shapePick) return `<button class="choice shape-choice ${cls}" data-k="${k}" ${game.answered ? "disabled" : ""} aria-label="形${k + 1}">${shapeSvg(c.name)}${game.answered ? `<span>${esc(c.name)}</span>` : ""}</button>`;
        return `<button class="choice ${cls}" data-k="${k}" ${game.answered ? "disabled" : ""}><b${c.name.length > 7 ? ' class="long"' : ""}>${esc(c.name)}</b>${c.yomi && !q.noYomi ? `<span>${c.yomi}</span>` : ""}</button>`;
      }).join("")}
    </div>`;
  }
  if (game.answered) html += callHtml();
  app.innerHTML = html;
  const hb = document.getElementById("hint-btn");
  if (hb) hb.onclick = () => { document.getElementById("hint").hidden = false; hb.hidden = true; };
  if (!game.answered) {
    app.querySelectorAll(".choice").forEach(b => b.onclick = () => answer(game.choices[+b.dataset.k].name, +b.dataset.k));
    app.querySelectorAll(".map.tap path[data-pref]").forEach(p => p.addEventListener("click", () => answer(p.dataset.pref, null)));
  } else {
    const nb = document.getElementById("next-btn");
    nb.onclick = afterCall;
    nb.focus({ preventScroll: true });
    const qb = document.getElementById("quit-btn");
    if (qb) qb.onclick = () => { game = null; render(); };
    animateMaps(app);
    document.getElementById("call").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function callHtml() {
  const s = me();
  const q = game.q;
  const p = P[q.pref];
  const ok = game.lastOk;
  const ball = ballOn();
  const title = ok ? (ball ? game.hitWord : pick(["せいかい！", "すごい！", "よくできました！", "ばっちり！"]))
    : game.mode === "trip" ? "おしい！もう一回" : ball ? "おしい、アウト！" : "ざんねん！";
  const verb = ["選手", "メジャー", "道のり"].includes(q.kind) ? "出身" : "";
  const missName = !ok && game.pickedName && P[game.pickedName] && P[game.pickedName].region === p.region ? game.pickedName : null;
  const mapOpts = { on: q.pref, miss: missName, zoom: true };
  if (game.mode === "trip") mapOpts.done = PREFS.slice(0, game.tripIdx).map(x => x.name); else mapOpts.got = s.stamps;
  let next = ball ? "つぎのバッター" : "つぎのもんだい";
  if (game.mode === "trip") next = ok ? (s.trip >= 47 ? "ゴール！" : "つぎの都道府県へ") : "もう一回チャレンジ";
  else if (isNine() && game.i === total() - 1) next = ball ? "しあい終了！けっかを見る" : "けっかを見る";
  const showFact = ok || game.mode !== "trip";
  let main;
  if (q.answer !== q.pref) main = `<p>こたえは <b>${esc(q.answer)}</b>。${q.kind === "道のり" ? `${esc(q.name)}は ${p.name}（${p.yomi}）出身だよ。` : ""}${ok ? "スタンプゲット！" : ""}</p>`;
  else if (q.blank || q.tap || q.shape || q.shapePick) main = `<p>こたえは <b>${p.name}</b>（${p.yomi}）。${!ok && game.pickedName ? `えらんだのは${esc(game.pickedName)}だよ。` : ""}${ok ? "スタンプゲット！" : ""}</p>`;
  else main = `<p>${esc(q.name)}は <b>${p.name}</b>（${p.yomi}）${verb}だよ。${ok ? "スタンプゲット！" : ""}</p>`;
  return `
    <div class="call ${ok ? "hit" : ""}" id="call">
      <h2>${title}</h2>
      ${main}
      <p class="think">この問題を考えた時間：${fmtTime(game.lastMs)}</p>
      ${showFact ? `<p class="fact">${q.rare ? `<span class="rare">びっくり記録</span>` : ""}${esc(q.fact)}</p>` : `<p class="fact">地図で場所をたしかめてから、もう一回やってみよう。</p>`}
      ${q.path ? `<p class="mlb"><b>道のり</b>　${q.path.map(esc).join(" → ")}</p>` : q.mlb && showFact ? `<p class="mlb"><b>メジャーにも行ったよ</b>　${esc(q.mlb)}</p>` : ""}
      ${q.kind !== "名産" ? `<div class="meisan">${p.name}の名産：${MEISAN[p.name].map(m => `<em>${m}</em>`).join("")}<span class="cap">県庁所在地：${CAPITALS[p.name][0]}</span></div>` : ""}
      ${mapSvg(mapOpts)}
      <button class="primary" id="next-btn">${next}</button>
      ${game.mode === "free" ? `<button class="ghost" id="quit-btn">ここでおわる</button>` : ""}
    </div>`;
}

function answer(name, k) {
  if (game.answered) return;
  const s = me();
  const ok = name === game.q.answer;
  game.lastMs = game.qStart ? performance.now() - game.qStart : 0;
  game.thinkMs += game.lastMs;
  game.answered = true; game.picked = k; game.pickedName = name; game.lastOk = ok;
  game.hitWord = pick(["ヒット！", "ツーベース！", "ホームラン！", "タイムリー！", "ナイスバッティング！"]);
  if (ok) addStamp(game.q.pref);
  if (game.mode === "free") {
    game.n++; if (ok) { game.ok++; game.streak++; } else game.streak = 0;
    if (game.streak > s.bestStreak) s.bestStreak = game.streak;
  } else if (game.mode === "trip") {
    if (ok) s.trip++;
  } else game.results.push(ok);
  persist();
  renderGame();
}

function afterCall() {
  const s = me();
  if (game.mode === "trip") {
    if (s.trip >= 47) { s.trip = 0; s.tripClears++; persist(); game.over = true; game.tripDone = true; return render(); }
    return nextQuestion();
  }
  if (game.mode === "free") return nextQuestion();
  if (game.i === total() - 1) {
    game.over = true;
    const score = game.results.filter(Boolean).length;
    if (game.mode !== "practice" && (s.best[game.mode] == null || score > s.best[game.mode])) { s.best[game.mode] = score; game.newBest = true; }
    const list = s.records[game.key] = s.records[game.key] || [];
    game.prev = list.length ? list[list.length - 1] : null;
    game.bestBefore = list.length ? Math.min(...list.map(r => r.ms)) : null;
    list.push({ d: Date.now(), ms: Math.round(game.thinkMs), score, n: total() });
    if (list.length > 40) list.shift();
    persist();
    return render();
  }
  game.i++;
  nextQuestion();
}

function compareMsg() {
  if (!game.prev) return "はじめての記録だよ。つぎはこのタイムをこえよう！";
  const d = (game.prev.ms - game.thinkMs) / 1000;
  let m = d > 0.05 ? `前回より ${d.toFixed(1)}びょう はやくなった！` : d < -0.05 ? `前回より ${(-d).toFixed(1)}びょう おそかったね。` : "前回とほぼ同じタイム！";
  if (game.bestBefore != null && game.thinkMs < game.bestBefore) m += "　じこベスト こうしん！";
  return m;
}

function renderResult() {
  const s = me();
  if (game.tripDone) {
    app.innerHTML = `<div class="result">
      <div class="big">日本一周</div>
      <h2>ゴール！おめでとう、${esc(s.name)}！</h2>
      <p>47都道府県ぜんぶ旅したよ。これで ${s.tripClears}周め クリア！</p>
      ${mapSvg({ done: PREFS.map(p => p.name), label: false })}
      <div class="row"><button class="primary" id="again">もう一周する</button><button class="ghost" id="home">モードをえらぶ</button></div>
    </div>`;
    document.getElementById("again").onclick = () => startGame("trip");
    document.getElementById("home").onclick = () => { game = null; render(); };
    return;
  }
  const score = game.results.filter(Boolean).length, N = total();
  const ball = ballOn();
  const msg = score === N ? [ball ? "パーフェクトゲーム！" : "ぜんもんせいかい！", "ぜんぶせいかい。すごい！"]
    : score >= N * 0.75 ? [ball ? "だいしょうり！" : "よくできました！", "あと少しでパーフェクト。まちがえたところをもう一回おぼえよう。"]
    : score >= N * 0.45 ? [ball ? "ナイスゲーム！" : "いいちょうし！", "くりかえすと、どんどん点がとれるよ。"]
    : [ball ? "つぎは逆転だ！" : "つぎはがんばろう！", "まずは地図を見ながらでOK。地方から考えてみよう。"];
  app.innerHTML = boardHtml() + `<div class="result">
    <div class="big">${score}<small>/${N}</small></div>
    <h2>${msg[0]}</h2>
    <p>${msg[1]}${game.newBest ? "　ベスト記録こうしん！" : ""}</p>
    <div class="timebox"><span>考えた時間</span><b>${fmtTime(game.thinkMs)}</b><em>${compareMsg()}</em></div>
    ${sparkline(s.records[game.key] || [])}
    <div class="row"><button class="primary" id="again">もう一回</button><button class="ghost" id="home">モードをえらぶ</button><button class="ghost" id="to-rec">きろくを見る</button></div>
  </div>`;
  document.getElementById("again").onclick = () => startGame(game.mode, game.practiceId);
  document.getElementById("home").onclick = () => { game = null; render(); };
  document.getElementById("to-rec").onclick = () => { game = null; view = "records"; render(); };
}

// タイムのうつりかわり（下にいくほど はやい）
function sparkline(list) {
  const pts = list.slice(-12);
  if (pts.length < 2) return "";
  const W = 320, H = 110, L = 44, R = 10, T = 12, B = 22;
  const ms = pts.map(p => p.ms / 1000);
  let lo = Math.min(...ms), hi = Math.max(...ms);
  if (hi - lo < 1) { hi += .5; lo = Math.max(0, lo - .5); }
  const x = i => L + (W - L - R) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const y = v => T + (H - T - B) * (v - lo) / (hi - lo);
  const line = ms.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const bestI = ms.indexOf(Math.min(...ms));
  return `<figure class="spark"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="タイムのうつりかわり">
    <line x1="${L}" x2="${W - R}" y1="${T}" y2="${T}" class="grid"/><line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" class="grid"/>
    <text x="${L - 6}" y="${T + 4}" text-anchor="end">${lo.toFixed(0)}秒</text>
    <text x="${L - 6}" y="${H - B + 4}" text-anchor="end">${hi.toFixed(0)}秒</text>
    <polyline points="${line}" class="ln"/>
    ${ms.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === ms.length - 1 ? 5 : 3}" class="${i === bestI ? "best" : i === ms.length - 1 ? "last" : "dot"}"/>`).join("")}
    <text x="${L}" y="${H - 6}">むかし</text><text x="${W - R}" y="${H - 6}" text-anchor="end">いま</text>
  </svg><figcaption>上のほうが はやいタイム（黄色＝いちばんはやい）</figcaption></figure>`;
}

function renderRecords() {
  const s = me();
  const keys = Object.keys(s.records).filter(k => s.records[k].length);
  const name = k => k.startsWith("p:") ? (() => { const [, id, sc] = k.split(":"); return `${PRACTICE.find(p => p.id === id).label}（${sc === "all" ? "全国" : AREAS[sc].label}）`; })() : AREAS[k] ? AREAS[k].label : k;
  app.innerHTML = `
    <h2 class="sec">${esc(s.name)}のきろく</h2>
    <p class="muted">9問・10問のモードをさいごまでやると、考えた時間が記録されるよ。タイムがちぢむほど、すらすら答えられるようになったしょうこ！</p>
    ${keys.length ? keys.map(k => {
      const list = s.records[k];
      const last = list[list.length - 1], first = list[0], best = Math.min(...list.map(r => r.ms));
      const diff = (first.ms - last.ms) / 1000;
      return `<div class="rec">
        <div class="rec-head"><b>${esc(name(k))}</b><span class="muted">${list.length}回</span></div>
        <div class="rec-nums">
          <div><span>さいしょ</span><b>${fmtTime(first.ms)}</b></div>
          <div><span>さいきん</span><b>${fmtTime(last.ms)}</b></div>
          <div><span>ベスト</span><b class="lamp">${fmtTime(best)}</b></div>
        </div>
        ${list.length > 1 ? `<p class="grow">${diff > 0 ? `さいしょより ${diff.toFixed(1)}びょう はやくなったよ！` : "まだまだ のびるよ。れんしゅうしてみよう！"}</p>` : ""}
        ${sparkline(list)}
      </div>`;
    }).join("") : `<div class="empty"><b>まだ記録がないよ</b><p class="muted">「あそぶ」から地方モードや れんしゅうモードを さいごまでやってみよう。</p></div>`}`;
}

function renderBook() {
  const s = me();
  app.innerHTML = `
    <div class="book-head"><h2 class="sec">${esc(s.name)}のスタンプ帳</h2><span class="count">${s.stamps.length} / 47</span></div>
    <p class="muted">せいかいした都道府県が地図にぬられていくよ。47こ ぜんぶ集めたら 日本一！</p>
    ${mapSvg({ got: s.stamps, label: false })}
    <div class="legend"><span><i style="background:var(--got)"></i>スタンプあり</span><span><i style="background:var(--land)"></i>まだ</span></div>
    ${REGION_NAMES.map(r => `
      <div class="region"><h3>${regionLabel(r)}</h3>
        <div class="cells">${PREFS.filter(p => p.region === r).map(p => `<div class="cell ${s.stamps.includes(p.name) ? "got" : ""}"><b>${p.name}</b><span>${p.yomi}</span><span>${CAPITALS[p.name][0]}</span><span>${MEISAN[p.name].join("・")}</span></div>`).join("")}</div>
      </div>`).join("")}`;
}

// ---------- しりょう（高校名・出場回数・優勝回数） ----------
function renderLists() {
  const tabs = [["schools", "高校名一覧"], ["apps", "出場回数ランキング"], ["wins", "優勝回数ランキング"]];
  const prefSel = `<select id="list-pref"><option value="all">全国</option>${REGION_NAMES.map(r => `<optgroup label="${regionLabel(r)}">${PREFS.filter(p => p.region === r).map(p => `<option value="${p.name}" ${listPref === p.name ? "selected" : ""}>${p.name}</option>`).join("")}</optgroup>`).join("")}</select>`;
  let body = "";
  const inPref = s => listPref === "all" || s.pref === listPref;
  if (listTab === "schools") {
    const prefs = listPref === "all" ? PREFS.map(p => p.name) : [listPref];
    body = prefs.map(pn => {
      const list = SCHOOLS.filter(s => s.pref === pn && s.apps).sort((a, b) => b.apps - a.apps);
      return `<div class="school-block"><h3>${pn}<span class="muted">（${list.length}校）</span></h3>
        <div class="tbl"><table><thead><tr><th>高校</th><th class="n">夏の出場</th><th class="n">夏の優勝</th><th class="n">春の優勝</th></tr></thead><tbody>
        ${list.map(s => `<tr><td><b>${esc(s.name)}</b><small>${esc(s.yomi)}</small></td><td class="n">${s.apps}回</td><td class="n">${s.sw || "―"}</td><td class="n">${s.spw || "―"}</td></tr>`).join("")}
        </tbody></table></div></div>`;
    }).join("");
  } else if (listTab === "apps") {
    const list = SCHOOLS.filter(s => s.apps && inPref(s)).sort((a, b) => b.apps - a.apps).slice(0, listPref === "all" ? 40 : 99);
    body = `<div class="tbl"><table><thead><tr><th class="n">順位</th><th>高校</th><th>都道府県</th><th class="n">夏の出場</th></tr></thead><tbody>
      ${list.map((s, i) => `<tr><td class="n">${list.findIndex(x => x.apps === s.apps) + 1}</td><td><b>${esc(s.name)}</b><small>${esc(s.yomi)}</small></td><td>${s.pref}</td><td class="n"><span class="bar" style="--w:${(s.apps / list[0].apps * 100).toFixed(0)}%"></span>${s.apps}回</td></tr>`).join("")}
    </tbody></table></div>`;
  } else {
    const champs = SCHOOLS.filter(s => (s.sw || s.spw) && inPref(s)).map(s => ({ ...s }));
    for (const [n, y, pr, c] of SPRING_ONLY_CHAMPS) if (listPref === "all" || pr === listPref) champs.push({ name: n, yomi: y, pref: pr, sw: 0, spw: c });
    champs.sort((a, b) => (b.sw + b.spw) - (a.sw + a.spw) || b.sw - a.sw);
    body = champs.length ? `<div class="tbl"><table><thead><tr><th>高校</th><th>都道府県</th><th class="n">夏</th><th class="n">春</th><th class="n">合計</th></tr></thead><tbody>
      ${champs.map(s => `<tr><td><b>${esc(s.name)}</b><small>${esc(s.yomi)}</small></td><td>${s.pref}</td><td class="n">${s.sw || "―"}</td><td class="n">${s.spw || "―"}</td><td class="n"><b class="lamp">${s.sw + s.spw}</b></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty"><b>${listPref}の学校は、まだ甲子園で優勝していないよ</b><p class="muted">はじめての優勝をめざして がんばっているところ！</p></div>`;
  }
  app.innerHTML = `
    <h2 class="sec">甲子園しりょう</h2>
    <div class="subtabs">${tabs.map(([id, l]) => `<button class="type" aria-pressed="${listTab === id}" data-lt="${id}">${l}</button>`).join("")}</div>
    <div class="row"><label class="muted" for="list-pref">都道府県</label>${prefSel}</div>
    ${body}
    <p class="note">夏の出場回数：Wikipediaの都道府県別の記録（2024年夏まで）に、2025年・2026年夏の出場校を足したもの。春の出場回数は入っていません。優勝回数は2026年夏まで。学校の名前は、むかしの名前（旧校名）の時代もふくめた記録です。</p>`;
  app.querySelectorAll("[data-lt]").forEach(b => b.onclick = () => { listTab = b.dataset.lt; renderLists(); });
  document.getElementById("list-pref").onchange = e => { listPref = e.target.value; renderLists(); };
}

render();

</script>

</body>
</html>
