<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>都道府県ベースボール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one narrow column styled like a hand-operated ballpark scoreboard; question card = the pitch, answers = swings */
:root {
  --board: #173b2c;
  --board-deep: #0f2a1f;
  --board-cell: #0b2118;
  --chalk: #f4f1e3;
  --chalk-dim: #b9c4b5;
  --lamp: #ffd23f;
  --stitch: #e4493e;
  --line: rgba(244, 241, 227, 0.16);
  --dirt: #c98b55;
  --f-display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
  --f-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--board-deep);
  color: var(--chalk);
  font-family: var(--f-body);
  font-weight: 500;
  font-size: 16px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(22px, 6vw, 30px);
  line-height: 1.2;
  margin: 0;
  letter-spacing: 0.02em;
  text-wrap: balance;
}
h1 small { display: block; font-family: var(--f-body); font-size: 13px; font-weight: 700; color: var(--chalk-dim); letter-spacing: 0.08em; }
.tabs { display: flex; gap: 6px; }
.tab {
  font: inherit; font-weight: 700; font-size: 14px;
  background: transparent; color: var(--chalk-dim);
  border: 2px solid var(--line); border-radius: 999px;
  padding: 6px 14px; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--chalk); color: var(--board-deep); border-color: var(--chalk); }

button:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }

/* scoreboard */
.board {
  background: var(--board);
  border: 3px solid var(--chalk);
  border-radius: 6px;
  padding: 12px;
  box-shadow: 0 6px 0 rgba(0,0,0,.35);
}
.board-scroll { overflow-x: auto; }
.board table { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 360px; }
.board th {
  font-family: var(--f-display); font-weight: 400; font-size: 13px; color: var(--chalk-dim);
  text-align: center; padding: 0;
}
.board td {
  background: var(--board-cell);
  font-family: var(--f-display);
  font-size: 22px;
  text-align: center;
  height: 42px;
  width: 9%;
  color: var(--chalk);
  border-radius: 3px;
  font-variant-numeric: tabular-nums;
}
.board td.name { width: auto; font-size: 14px; text-align: left; padding-inline: 8px; background: transparent; white-space: nowrap; }
.board td.now { box-shadow: inset 0 0 0 2px var(--lamp); }
.board td.hit { color: var(--lamp); }
.board td.out { color: var(--chalk-dim); }
.board td.total { background: var(--chalk); color: var(--board-deep); width: 12%; }
.board-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--chalk-dim); gap: 10px; flex-wrap: wrap; }
.lamps { display: flex; gap: 14px; }
.lamps span { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-display); }
.lamp { width: 12px; height: 12px; border-radius: 50%; background: var(--board-cell); border: 1px solid var(--line); display: inline-block; }
.lamp.on { background: var(--lamp); border-color: var(--lamp); box-shadow: 0 0 8px var(--lamp); }

/* mode select */
.intro { font-size: 15px; color: var(--chalk-dim); margin: 0; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.mode {
  font: inherit; text-align: left; cursor: pointer;
  background: var(--chalk); color: var(--board-deep);
  border: none; border-radius: 10px;
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 2px;
  box-shadow: 0 4px 0 var(--dirt);
  transition: transform .1s;
}
.mode:hover { transform: translateY(-2px); }
.mode:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--dirt); }
.mode b { font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.mode span { font-size: 13px; font-weight: 700; opacity: .75; }

/* pitch card */
.pitch {
  background: var(--chalk);
  color: var(--board-deep);
  border-radius: 12px;
  padding: 18px 18px 16px;
  position: relative;
  overflow: hidden;
}
.pitch::before, .pitch::after {
  content: ""; position: absolute; width: 140px; height: 140px; border-radius: 50%;
  border: 2px dashed var(--stitch); opacity: .35; pointer-events: none;
}
.pitch::before { right: -100px; top: -40px; }
.pitch::after { left: -110px; bottom: -70px; }
.pitch .inning { font-size: 13px; font-weight: 900; letter-spacing: .1em; color: var(--stitch); }
.pitch .kind { display: inline-block; font-size: 12px; font-weight: 900; background: var(--board); color: var(--chalk); border-radius: 4px; padding: 1px 8px; margin-left: 8px; letter-spacing: .05em; }
.pitch .subject { font-family: var(--f-display); font-weight: 400; font-size: clamp(24px, 7vw, 34px); line-height: 1.25; margin: 8px 0 0; text-wrap: balance; }
.pitch .reading { font-size: 14px; font-weight: 700; opacity: .7; }
.pitch .ask { font-size: 17px; font-weight: 900; margin: 8px 0 0; }
.hint-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.hint-btn { font: inherit; font-size: 13px; font-weight: 700; background: transparent; border: 2px solid var(--board); color: var(--board); border-radius: 999px; padding: 2px 12px; cursor: pointer; }
.hint { font-size: 14px; font-weight: 900; color: var(--board); }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice {
  font: inherit; cursor: pointer;
  background: var(--board); color: var(--chalk);
  border: 2px solid var(--line); border-radius: 10px;
  padding: 12px 8px; min-height: 76px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
}
.choice:hover:not(:disabled) { border-color: var(--chalk); }
.choice b { font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.3; }
.choice span { font-size: 12px; font-weight: 700; color: var(--chalk-dim); }
.choice:disabled { cursor: default; opacity: .45; }
.choice.right { opacity: 1; background: var(--lamp); color: var(--board-deep); border-color: var(--lamp); }
.choice.right span { color: var(--board-deep); }
.choice.wrong { opacity: 1; border-color: var(--stitch); background: #3a2420; }

.call {
  border-radius: 12px; padding: 14px 16px;
  border: 2px solid var(--line);
  display: flex; flex-direction: column; gap: 6px;
}
.call.hit { border-color: var(--lamp); }
.call h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.2; }
.call.hit h2 { color: var(--lamp); }
.call p { margin: 0; font-size: 15px; }
.call .fact { color: var(--chalk-dim); font-size: 14px; }
.rare { display: inline-block; font-size: 11px; font-weight: 900; background: var(--stitch); color: var(--chalk); border-radius: 4px; padding: 0 7px; margin-right: 6px; letter-spacing: .05em; }
.pitch .kind.team { background: var(--stitch); }
.next {
  font: inherit; font-family: var(--f-display); font-size: 18px; cursor: pointer;
  background: var(--chalk); color: var(--board-deep); border: none; border-radius: 10px;
  padding: 12px; margin-top: 6px; box-shadow: 0 4px 0 var(--dirt);
}
.next:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--dirt); }

.result { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; padding-block: 8px; }
.result .big { font-family: var(--f-display); font-size: clamp(56px, 18vw, 88px); line-height: 1; color: var(--lamp); }
.result h2 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0; }
.result p { margin: 0; color: var(--chalk-dim); max-width: 32em; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ghost { font: inherit; font-weight: 700; background: transparent; color: var(--chalk); border: 2px solid var(--line); border-radius: 10px; padding: 10px 16px; cursor: pointer; }

/* stamp book */
.book-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.book-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0; }
.book-head .count { font-family: var(--f-display); color: var(--lamp); font-size: 20px; font-variant-numeric: tabular-nums; }
.region { display: flex; flex-direction: column; gap: 6px; }
.region h3 { margin: 0; font-size: 13px; font-weight: 900; letter-spacing: .12em; color: var(--chalk-dim); }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.cell {
  background: var(--board); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 4px; text-align: center; position: relative; min-height: 58px;
  display: flex; flex-direction: column; justify-content: center;
}
.cell b { font-size: 15px; font-weight: 900; line-height: 1.3; }
.cell span { font-size: 10px; color: var(--chalk-dim); }
.cell.got { background: var(--chalk); color: var(--board-deep); border-color: var(--chalk); }
.cell.got span { color: var(--board-deep); opacity: .6; }
.cell.got::after {
  content: ""; position: absolute; top: -6px; right: -4px; width: 22px; height: 22px; border-radius: 50%;
  background:
    radial-gradient(circle at 0 50%, transparent 8px, var(--stitch) 8px, var(--stitch) 9px, transparent 9px),
    radial-gradient(circle at 100% 50%, transparent 8px, var(--stitch) 8px, var(--stitch) 9px, transparent 9px),
    #fff;
  border: 1px solid #d8d3c0;
  transform: rotate(-20deg);
}
.reset { align-self: flex-start; font-size: 13px; padding: 6px 12px; }
.confirm { font-size: 14px; color: var(--chalk-dim); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

@media (max-width: 380px) { .choice b { font-size: 19px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.9); opacity: .4; } to { transform: scale(1); opacity: 1; } }
.call, .result { animation: pop .18s ease-out; }
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

<div class="wrap">
  <header>
    <h1><small>やきゅうで おぼえる</small>都道府県ベースボール</h1>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-play" role="tab" aria-selected="true">あそぶ</button>
      <button class="tab" id="tab-book" role="tab" aria-selected="false">スタンプ帳</button>
    </div>
  </header>

  <section id="view-play" class="wrap" style="gap:18px">
    <div class="board">
      <div class="board-scroll">
        <table>
          <thead><tr id="board-head"></tr></thead>
          <tbody><tr id="board-row"></tr></tbody>
        </table>
      </div>
      <div class="board-meta">

      </div>
    </div>
    <div id="stage"></div>

  <section id="view-book" class="wrap" style="gap:14px" hidden></section>
</div>

function schoolQuestion(prefName) {
  const list = SCHOOLS_RAW[prefName];
  const [name, yomi, fact, rare] = list[Math.floor(Math.random() * list.length)];
  return { kind: "高校野球", name: name + "高校", yomi, pref: prefName, fact, rare };
}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// 同じ都道府県ができるだけ重ならないように選ぶ
function pickSpread(list, n, used = new Set()) {
  const out = [];
  for (const q of shuffle(list)) {
    if (out.length >= n) break;
    if (!used.has(q.pref)) { out.push(q); used.add(q.pref); }
  }
  for (const q of shuffle(list)) { if (out.length >= n) break; if (!out.includes(q)) out.push(q); }
  return out;
}

function buildQuestions(mode) {
  if (mode === "pro") return shuffle(TEAMS).slice(0, 9);
  if (mode === "player") return pickSpread(PLAYERS, 9);
  if (mode === "hs") return shuffle(Object.keys(SCHOOLS_RAW)).slice(0, 9).map(schoolQuestion);
  if (mode === "new") {
    const missing = PREFS.map(p => p.name).filter(n => !stamps.has(n));
    const pool = missing.length >= 9 ? missing : Object.keys(SCHOOLS_RAW);
    return shuffle(pool).slice(0, 9).map(schoolQuestion);
  }
  // mix: 2 teams + 3 players + 4 schools
  const used = new Set();
  const t = pickSpread(TEAMS, 2, used);
  const pl = pickSpread(PLAYERS, 3, used);
  const s = shuffle(Object.keys(SCHOOLS_RAW).filter(n => !used.has(n))).slice(0, 4).map(schoolQuestion);
  return shuffle([...t, ...pl, ...s]);
}

function makeChoices(correct) {
  const c = P[correct];
  const near = shuffle(PREFS.filter(p => p.region === c.region && p.name !== correct)).slice(0, 1);
  const taken = new Set([correct, ...near.map(p => p.name)]);
  const far = shuffle(PREFS.filter(p => !taken.has(p.name))).slice(0, 3 - near.length);
  return shuffle([c, ...near, ...far]);
}

    if (r === true) return `<td class="hit${now}">1</td>`;
    if (r === false) return `<td class="out${now}">0</td>`;
    return `<td class="${now.trim()}"></td>`;
  }).join("");
  const total = game ? game.results.filter(Boolean).length : 0;
  $("board-row").innerHTML = `<td class="name">きみ</td>${cells}<td class="total">${total}</td>`;
  const last = game && game.results.length ? game.results[game.results.length - 1] : null;
  $("lamp-h").classList.toggle("on", last === true && !game.over);
  const outs = game ? game.results.filter(r => r === false).length % 3 : 0;
  ["lamp-o1", "lamp-o2", "lamp-o3"].forEach((id, k) => $(id).classList.toggle("on", k < outs));
}

function showStart() {
  game = null;
  drawBoard();
  const left = 47 - stamps.size;
  stage.innerHTML = `
    <div class="wrap" style="gap:12px">
      <p class="intro">チームや選手、高校の名前を見て、どこの都道府県か当てよう。せいかいした都道府県はスタンプ帳にたまっていくよ。</p>
      <div class="modes">
        <button class="mode" data-mode="pro"><b>プロ野球</b><span>12球団のホームはどこ？</span></button>
        <button class="mode" data-mode="player"><b>選手</b><span>あの選手の出身はどこ？</span></button>
        <button class="mode" data-mode="hs"><b>高校野球</b><span>甲子園の強い学校はどこの県？</span></button>
        <button class="mode" data-mode="mix"><b>ミックス</b><span>球団・選手・高校をまぜて9問</span></button>
        <button class="mode" data-mode="new"><b>スタンプあつめ</b><span>まだの都道府県から出るよ（のこり${left}）</span></button>
      </div>
    </div>`;
  stage.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => startGame(b.dataset.mode)));
}

function startGame(mode) {
  game = { mode, qs: buildQuestions(mode), i: 0, results: [], over: false, answered: false };
  showQuestion();
}

function showQuestion() {
  const q = game.qs[game.i];
  game.answered = false;
  game.choices = makeChoices(q.pref);
  drawBoard();
  const ask = q.kind === "プロ野球" ? "このチームのホームは どこの都道府県？" : q.kind === "選手" ? "この選手の出身は どこの都道府県？" : "この高校は どこの都道府県？";
  stage.innerHTML = `
    <div class="wrap" style="gap:12px">
      <div class="pitch">
        <div><span class="inning">${game.i + 1}回</span><span class="kind">${q.kind}</span>${q.sub ? `<span class="kind team">${q.sub}</span>` : ""}</div>
        <p class="subject">${q.name}</p>
        <div class="reading">${q.yomi}</div>
        <p class="ask">${ask}</p>
        <div class="hint-row"><button class="hint-btn" id="hint-btn">ヒントを見る</button><span class="hint" id="hint" hidden>${P[q.pref].region}だよ</span></div>
      </div>
      <div class="choices">
        ${game.choices.map((c, k) => `<button class="choice" id="choice-${k}" data-k="${k}"><b>${c.name}</b><span>${c.yomi}</span></button>`).join("")}
      </div>
      <div id="call"></div>
    </div>`;
  $("hint-btn").addEventListener("click", () => { $("hint").hidden = false; $("hint-btn").hidden = true; });
  stage.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.k)));
}

function answer(k) {
  if (game.answered) return;
  game.answered = true;
  const q = game.qs[game.i];
  const picked = game.choices[k];
  const ok = picked.name === q.pref;
  game.results.push(ok);
  if (ok) { stamps.add(q.pref); saveStamps(); }
  stage.querySelectorAll(".choice").forEach((b, j) => {
    b.disabled = true;
    if (game.choices[j].name === q.pref) b.classList.add("right");
    else if (j === k) b.classList.add("wrong");
  });
  const p = P[q.pref];
  const isLast = game.i === 8;
  const hitWords = ["ヒット！", "ツーベース！", "ホームラン！", "タイムリー！"];
  const title = ok ? hitWords[Math.floor(Math.random() * hitWords.length)] : "おしい、アウト！";
  $("call").innerHTML = `
    <div class="call ${ok ? "hit" : ""}">
      <h2>${title}</h2>
      <p>${q.name}は <b>${p.name}</b>（${p.yomi}）${q.kind === "選手" ? "出身" : ""}だよ。${ok ? "スタンプゲット！" : ""}</p>
      <p class="fact">${q.rare ? `<span class="rare">びっくり記録</span>` : ""}${q.fact}</p>
      <button class="next" id="next-btn">${isLast ? "しあい終了！けっかを見る" : "つぎのバッター"}</button>
    </div>`;
  drawBoard();
  $("next-btn").focus({ preventScroll: true });
  $("next-btn").addEventListener("click", () => {
    if (isLast) return showResult();
    game.i++;
    showQuestion();
  });
}

function showResult() {
  game.over = true;
  drawBoard();
  const score = game.results.filter(Boolean).length;
  const msg = score === 9 ? ["パーフェクトゲーム！", "9回ぜんぶせいかい。もう都道府県のエースだね。"]
    : score >= 7 ? ["だいしょうり！", "あと少しでパーフェクト。まちがえた県をもう一回おぼえよう。"]
    : score >= 4 ? ["ナイスゲーム！", "いい打線だった！くりかえすと、どんどん点がとれるよ。"]
    : ["つぎは逆転だ！", "まずはヒントを見ながらでOK。地方から考えてみよう。"];
  const missed = game.qs.filter((q, i) => !game.results[i]);
  stage.innerHTML = `
    <div class="result">
      <div class="big">${score}点</div>
      <h2>${msg[0]}</h2>
      <p>${msg[1]}</p>
      ${missed.length ? `<p>おさらい：${missed.map(q => `${q.name} → <b style="color:var(--chalk)">${q.pref}</b>`).join("、")}</p>` : ""}
      <p>スタンプ帳 ${stamps.size} / 47</p>
      <div class="row">
        <button class="next" id="again">もう一回（おなじモード）</button>
        <button class="ghost" id="home">モードをえらぶ</button>
        <button class="ghost" id="to-book">スタンプ帳を見る</button>
      </div>
    </div>`;
  $("again").addEventListener("click", () => startGame(game.mode));
  $("home").addEventListener("click", showStart);
  $("to-book").addEventListener("click", () => setTab("book"));
}

function drawBook(confirming) {
  const v = $("view-book");
  v.innerHTML = `
    <div class="book-head"><h2>都道府県スタンプ帳</h2><span class="count">${stamps.size} / 47</span></div>
    <p class="intro">せいかいした都道府県にボールのスタンプがつくよ。47こ ぜんぶ集めたら 日本一！</p>
    ${REGIONS.map(r => `
      <div class="region">
        <h3>${r}</h3>
        <div class="cells">${PREFS.filter(p => p.region === r).map(p => `<div class="cell ${stamps.has(p.name) ? "got" : ""}"><b>${p.name}</b><span>${p.yomi}</span></div>`).join("")}</div>
      </div>`).join("")}
    ${confirming
      ? `<div class="confirm">スタンプを ぜんぶ消しますか？ <button class="ghost reset" id="reset-yes">消す</button><button class="ghost reset" id="reset-no">やめる</button></div>`
      : `<button class="ghost reset" id="reset">スタンプをリセット</button>`}`;
  if (confirming) {
    $("reset-yes").addEventListener("click", () => { stamps = new Set(); saveStamps(); drawBook(false); });
    $("reset-no").addEventListener("click", () => drawBook(false));
  } else {
    $("reset").addEventListener("click", () => drawBook(true));
  }
}

function setTab(t) {
  $("tab-play").setAttribute("aria-selected", t === "play");
  $("tab-book").setAttribute("aria-selected", t === "book");
  $("view-play").hidden = t !== "play";
  $("view-book").hidden = t !== "book";
  if (t === "book") drawBook(false);
  if (t === "play" && (!game || game.over)) showStart();
}
$("tab-play").addEventListener("click", () => setTab("play"));
$("tab-book").addEventListener("click", () => setTab("book"));

showStart();
</script>

</body>
</html>
