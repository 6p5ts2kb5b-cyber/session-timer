<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>都道府県ベースボール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one narrow column styled like a hand-operated ballpark scoreboard; question card = the pitch; map = the away-game travel board */
:root {
  --board: #173b2c;
  --board-deep: #0f2a1f;
  --board-cell: #0b2118;
  --chalk: #f4f1e3;
  --chalk-dim: #b9c4b5;
  --lamp: #ffd23f;
  --stitch: #e4493e;
  --line: rgba(244, 241, 227, 0.16);
  --dirt: #c98b55;
  --land: #2c5a45;
  --f-display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
  --f-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--board-deep);
  color: var(--chalk);
  font-family: var(--f-body);
  font-weight: 500;
  font-size: 16px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 20px 40px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(22px, 6vw, 30px); line-height: 1.2; margin: 0; letter-spacing: .02em; text-wrap: balance; }
h1 small { display: block; font-family: var(--f-body); font-size: 13px; font-weight: 700; color: var(--chalk-dim); letter-spacing: .08em; }
h2.sec { font-family: var(--f-display); font-weight: 400; font-size: 20px; margin: 0; }
.muted { color: var(--chalk-dim); font-size: 14px; margin: 0; }
.player-chip { display: flex; align-items: center; gap: 8px; font-weight: 900; }
.player-chip .who { background: var(--chalk); color: var(--board-deep); border-radius: 999px; padding: 3px 12px; }

button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
.ghost { font-weight: 700; background: transparent; color: var(--chalk); border: 2px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.ghost.small { font-size: 13px; padding: 4px 10px; border-radius: 999px; }
.primary { font-family: var(--f-display); font-size: 18px; background: var(--chalk); color: var(--board-deep); border: none; border-radius: 10px; padding: 12px 16px; box-shadow: 0 4px 0 var(--dirt); }
.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--dirt); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.tabs { display: flex; gap: 6px; }
.tab { font-weight: 700; font-size: 14px; background: transparent; color: var(--chalk-dim); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; }
.tab[aria-selected="true"] { background: var(--chalk); color: var(--board-deep); border-color: var(--chalk); }

/* save slots */
.slots { display: flex; flex-direction: column; gap: 10px; }
.slot { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; background: var(--board); border: 2px solid var(--line); border-radius: 12px; padding: 12px; }
.slot .no { font-family: var(--f-display); font-size: 22px; text-align: center; color: var(--lamp); }
.slot .info { min-width: 0; }
.slot .nm { font-weight: 900; font-size: 18px; overflow-wrap: anywhere; }
.slot .meta { font-size: 13px; color: var(--chalk-dim); }
.slot input { font: inherit; font-weight: 700; width: 100%; background: var(--board-cell); color: var(--chalk); border: 2px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.slot .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 440px) { .slot { grid-template-columns: 36px 1fr; } .slot .acts { grid-column: 1 / -1; justify-content: flex-start; } }

/* mode select */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.mode { text-align: left; background: var(--chalk); color: var(--board-deep); border: none; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 4px 0 var(--dirt); transition: transform .1s; }
.mode:hover { transform: translateY(-2px); }
.mode:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--dirt); }
.mode b { font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.mode span { font-size: 13px; font-weight: 700; opacity: .75; }
.mode .best { font-size: 12px; font-weight: 900; color: var(--stitch); opacity: 1; }
.mode.trip { grid-column: 1 / -1; background: var(--lamp); }
.types { display: flex; gap: 8px; flex-wrap: wrap; }
.type { font-weight: 900; font-size: 14px; background: transparent; color: var(--chalk-dim); border: 2px dashed var(--line); border-radius: 999px; padding: 5px 14px; }
.type[aria-pressed="true"] { background: var(--stitch); color: var(--chalk); border: 2px solid var(--stitch); }

/* scoreboard */
.board { background: var(--board); border: 3px solid var(--chalk); border-radius: 6px; padding: 12px; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
.board-scroll { overflow-x: auto; }
.board table { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 360px; }
.board th { font-family: var(--f-display); font-weight: 400; font-size: 13px; color: var(--chalk-dim); text-align: center; padding: 0; }
.board td { background: var(--board-cell); font-family: var(--f-display); font-size: 22px; text-align: center; height: 42px; width: 9%; color: var(--chalk); border-radius: 3px; font-variant-numeric: tabular-nums; }
.board td.name { width: auto; font-size: 14px; text-align: left; padding-inline: 8px; background: transparent; white-space: nowrap; max-width: 7em; overflow: hidden; text-overflow: ellipsis; }
.board td.now { box-shadow: inset 0 0 0 2px var(--lamp); }
.board td.hit { color: var(--lamp); }
.board td.out { color: var(--chalk-dim); }
.board td.total { background: var(--chalk); color: var(--board-deep); width: 12%; }
.board-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--chalk-dim); gap: 10px; flex-wrap: wrap; }
.tally { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tally div { background: var(--board-cell); border-radius: 4px; text-align: center; padding: 6px 4px; }
.tally b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.2; color: var(--lamp); font-variant-numeric: tabular-nums; }
.tally span { font-size: 12px; color: var(--chalk-dim); font-weight: 700; }
.trip-bar { height: 12px; background: var(--board-cell); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.trip-bar i { display: block; height: 100%; background: var(--lamp); }
.trip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.trip-head b { font-family: var(--f-display); font-weight: 400; font-size: 22px; }

/* pitch card */
.pitch { background: var(--chalk); color: var(--board-deep); border-radius: 12px; padding: 18px 18px 16px; position: relative; overflow: hidden; }
.pitch::before, .pitch::after { content: ""; position: absolute; width: 140px; height: 140px; border-radius: 50%; border: 2px dashed var(--stitch); opacity: .35; pointer-events: none; }
.pitch::before { right: -100px; top: -40px; }
.pitch::after { left: -110px; bottom: -70px; }
.pitch .inning { font-size: 13px; font-weight: 900; letter-spacing: .1em; color: var(--stitch); }
.tag { display: inline-block; font-size: 12px; font-weight: 900; background: var(--board); color: var(--chalk); border-radius: 4px; padding: 1px 8px; margin-left: 6px; letter-spacing: .05em; }
.tag.red { background: var(--stitch); }
.pitch .subject { font-family: var(--f-display); font-weight: 400; font-size: clamp(24px, 7vw, 34px); line-height: 1.25; margin: 8px 0 0; text-wrap: balance; }
.pitch .reading { font-size: 14px; font-weight: 700; opacity: .7; }
.pitch .ask { font-size: 17px; font-weight: 900; margin: 8px 0 0; }
.hint-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.hint-btn { font-size: 13px; font-weight: 700; background: transparent; border: 2px solid var(--board); color: var(--board); border-radius: 999px; padding: 2px 12px; }
.hint { font-size: 14px; font-weight: 900; color: var(--board); }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { background: var(--board); color: var(--chalk); border: 2px solid var(--line); border-radius: 10px; padding: 12px 8px; min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.choice:hover:not(:disabled) { border-color: var(--chalk); }
.choice b { font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.3; }
.choice span { font-size: 12px; font-weight: 700; color: var(--chalk-dim); }
.choice:disabled { cursor: default; opacity: .45; }
.choice.right { opacity: 1; background: var(--lamp); color: var(--board-deep); border-color: var(--lamp); }
.choice.right span { color: var(--board-deep); }
.choice.wrong { opacity: 1; border-color: var(--stitch); background: #3a2420; }
@media (max-width: 380px) { .choice b { font-size: 19px; } }

.call { border-radius: 12px; padding: 14px 16px; border: 2px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.call.hit { border-color: var(--lamp); }
.call h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0; line-height: 1.2; }
.call.hit h2 { color: var(--lamp); }
.call p { margin: 0; font-size: 15px; }
.call .fact { color: var(--chalk-dim); font-size: 14px; }
.call .mlb { font-size: 14px; background: var(--board-cell); border-radius: 8px; padding: 6px 10px; }
.call .mlb b { color: var(--lamp); }
.meisan { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.meisan em { font-style: normal; font-weight: 900; background: var(--chalk); color: var(--board-deep); border-radius: 999px; padding: 1px 10px; }
.rare { display: inline-block; font-size: 11px; font-weight: 900; background: var(--stitch); color: var(--chalk); border-radius: 4px; padding: 0 7px; margin-right: 6px; letter-spacing: .05em; }

/* map */
.map { background: var(--board-cell); border-radius: 10px; padding: 6px; }
.map svg { display: block; width: 100%; height: auto; max-height: 420px; }
.map path { fill: var(--land); stroke: var(--board-deep); stroke-width: 2; stroke-linejoin: round; }
.map path.got { fill: #6f8f5a; }
.map path.done { fill: var(--dirt); }
.map path.on { fill: var(--lamp); }
.map path.miss { fill: var(--stitch); }
.map .inset { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 8 6; }
.map .ring { fill: none; stroke: var(--lamp); stroke-width: 5; }
.map .ring.pulse { animation: pulse 1.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.map text { font-family: var(--f-body); font-weight: 900; font-size: 44px; fill: var(--chalk); stroke: var(--board-deep); stroke-width: 10px; paint-order: stroke; }
.map .credit { font-size: 22px; font-weight: 500; fill: var(--chalk-dim); stroke: none; }
@keyframes pulse { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

.result { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; padding-block: 8px; }
.result .big { font-family: var(--f-display); font-size: clamp(56px, 18vw, 88px); line-height: 1; color: var(--lamp); }
.result h2 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0; }
.result p { margin: 0; color: var(--chalk-dim); max-width: 32em; }
.result .row { justify-content: center; }

/* stamp book */
.book-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.book-head .count { font-family: var(--f-display); color: var(--lamp); font-size: 20px; font-variant-numeric: tabular-nums; }
.region { display: flex; flex-direction: column; gap: 6px; }
.region h3 { margin: 0; font-size: 13px; font-weight: 900; letter-spacing: .12em; color: var(--chalk-dim); }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.cell { background: var(--board); border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px; text-align: center; position: relative; display: flex; flex-direction: column; justify-content: center; }
.cell b { font-size: 15px; font-weight: 900; line-height: 1.3; }
.cell span { font-size: 10px; color: var(--chalk-dim); line-height: 1.4; }
.cell.got { background: var(--chalk); color: var(--board-deep); border-color: var(--chalk); }
.cell.got span { color: var(--board-deep); opacity: .65; }
.cell.got::after { content: ""; position: absolute; top: -6px; right: -4px; width: 22px; height: 22px; border-radius: 50%;
  background: radial-gradient(circle at 0 50%, transparent 8px, var(--stitch) 8px, var(--stitch) 9px, transparent 9px), radial-gradient(circle at 100% 50%, transparent 8px, var(--stitch) 8px, var(--stitch) 9px, transparent 9px), #fff;
  border: 1px solid #d8d3c0; transform: rotate(-20deg); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--chalk-dim); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.94); opacity: .4; } to { transform: scale(1); opacity: 1; } }
.call, .result { animation: pop .18s ease-out; }
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

<div class="wrap">

    <h1><small>やきゅうで おぼえる</small>都道府県ベースボール</h1>

<script>

const PREFS = [
  ["北海道","ほっかいどう","北海道地方"],
  ["青森県","あおもりけん","東北地方"],["岩手県","いわてけん","東北地方"],["宮城県","みやぎけん","東北地方"],["秋田県","あきたけん","東北地方"],["山形県","やまがたけん","東北地方"],["福島県","ふくしまけん","東北地方"],
  ["茨城県","いばらきけん","関東地方"],["栃木県","とちぎけん","関東地方"],["群馬県","ぐんまけん","関東地方"],["埼玉県","さいたまけん","関東地方"],["千葉県","ちばけん","関東地方"],["東京都","とうきょうと","関東地方"],["神奈川県","かながわけん","関東地方"],
  ["新潟県","にいがたけん","中部地方"],["富山県","とやまけん","中部地方"],["石川県","いしかわけん","中部地方"],["福井県","ふくいけん","中部地方"],["山梨県","やまなしけん","中部地方"],["長野県","ながのけん","中部地方"],["岐阜県","ぎふけん","中部地方"],["静岡県","しずおかけん","中部地方"],["愛知県","あいちけん","中部地方"],
  ["三重県","みえけん","近畿地方"],["滋賀県","しがけん","近畿地方"],["京都府","きょうとふ","近畿地方"],["大阪府","おおさかふ","近畿地方"],["兵庫県","ひょうごけん","近畿地方"],["奈良県","ならけん","近畿地方"],["和歌山県","わかやまけん","近畿地方"],
  ["鳥取県","とっとりけん","中国地方"],["島根県","しまねけん","中国地方"],["岡山県","おかやまけん","中国地方"],["広島県","ひろしまけん","中国地方"],["山口県","やまぐちけん","中国地方"],
  ["徳島県","とくしまけん","四国地方"],["香川県","かがわけん","四国地方"],["愛媛県","えひめけん","四国地方"],["高知県","こうちけん","四国地方"],
  ["福岡県","ふくおかけん","九州地方"],["佐賀県","さがけん","九州地方"],["長崎県","ながさきけん","九州地方"],["熊本県","くまもとけん","九州地方"],["大分県","おおいたけん","九州地方"],["宮崎県","みやざきけん","九州地方"],["鹿児島県","かごしまけん","九州地方"],["沖縄県","おきなわけん","九州地方"]
].map(([name, yomi, region]) => ({ name, yomi, region }));
const P = Object.fromEntries(PREFS.map(p => [p.name, p]));
const REGIONS = [...new Set(PREFS.map(p => p.region))];

// プロ野球12球団と本拠地の市
const TEAMS = [
  ["読売ジャイアンツ","よみうりジャイアンツ","東京都","ホームは東京ドーム（文京区）。セ・リーグのチームだよ。"],
  ["東京ヤクルトスワローズ","とうきょうヤクルトスワローズ","東京都","ホームは神宮球場（新宿区）。東京には2つもプロ野球チームがあるんだ。"],
  ["横浜DeNAベイスターズ","よこはまディーエヌエーベイスターズ","神奈川県","ホームは横浜市の横浜スタジアム。横浜は神奈川県の県庁所在地だよ。"],

  ["阪神タイガース","はんしんタイガース","兵庫県","ホームの甲子園球場は兵庫県西宮市にあるよ。大阪府じゃないのがポイント！"],
  ["広島東洋カープ","ひろしまとうようカープ","広島県","ホームは広島市。チームの色の赤は、広島の人たちの応援カラーだね。"],
  ["北海道日本ハムファイターズ","ほっかいどうにっぽんハムファイターズ","北海道","ホームは北広島市。北海道は日本でいちばん広い都道府県だよ。"],
  ["東北楽天ゴールデンイーグルス","とうほくらくてんゴールデンイーグルス","宮城県","ホームは仙台市。仙台は宮城県の県庁所在地で、東北地方でいちばん大きな町だよ。"],
  ["埼玉西武ライオンズ","さいたませいぶライオンズ","埼玉県","ホームは所沢市。ドームの屋根がある球場だよ。"],
  ["千葉ロッテマリーンズ","ちばロッテマリーンズ","千葉県","ホームは千葉市の海のそば。海風がつよい球場で有名だよ。"],
  ["オリックス・バファローズ","オリックス・バファローズ","大阪府","ホームは大阪市のドーム球場。大阪は「府」がつくめずらしい都道府県だよ。"],
  ["福岡ソフトバンクホークス","ふくおかソフトバンクホークス","福岡県","ホームは福岡市のドーム球場。福岡は九州地方でいちばん人が多い県だよ。"]
].map(([name, yomi, pref, fact]) => ({ kind: "プロ野球", name, yomi, pref, fact }));

// 高校野球の強豪校と甲子園の記録（2026年9月時点）。rare=1 は「びっくり記録」
const SCHOOLS_RAW = {
  "北海道":[
    ["駒大苫小牧","こまだいとまこまい","2004年夏に北海道の学校として初めて甲子園で優勝。次の年も勝って夏2連覇！田中将大投手や伊藤大海投手の母校だよ。"],
    ["北海","ほっかい","夏の甲子園に出た回数が全国でいちばん多い学校。2016年夏は準優勝したよ。",1]],
  "青森県":[["八戸学院光星","はちのへがくいんこうせい","2011年夏・2012年春・2012年夏と、3大会つづけて決勝まで進んで準優勝。坂本勇人選手の母校だよ。",1]],
  "岩手県":[["花巻東","はなまきひがし","大谷翔平選手と菊池雄星投手の母校。2009年春は準優勝、同じ年の夏もベスト4まで進んだよ。"]],

function careerQs(c, prefOnly) {
  const sub = c.status === "now" ? c.now : c.status === "npb" ? `いまは${c.now}` : "元メジャーリーガー";
  const base = { name: c.name, sub, yomi: c.yomi, pref: c.pref, fact: c.fact, rare: c.rare, path: c.path };
  const out = [{ ...base, kind: "メジャー" }];
  if (prefOnly) return out;
  const opts = (answer, pool) => {
    const bad = SAME_TEAM[answer] || [];
    return shuffle([answer, ...shuffle(pool.filter(x => x !== answer && !bad.includes(x))).slice(0, 3)]);
  };
  out.push({ ...base, kind: "道のり", ask: "この選手の出身高校は どこ？", answer: c.school + "高校", options: opts(c.school + "高校", SCHOOL_POOL.map(x => x + "高校")) });

  out.push({ ...base, kind: "道のり", ask: "この選手が メジャーで最初に入ったチームは？", answer: c.mlb, options: opts(c.mlb, MLB_TEAMS) });
  return out;
}

function questionsFor(pref, types, prefOnly = false) {
  const out = [];
  if (types.includes("team")) out.push(...TEAMS.filter(q => q.pref === pref));
  if (types.includes("player")) out.push(...PLAYERS.filter(q => q.pref === pref));
  if (types.includes("mlb")) {
    for (const c of CAREER.filter(c => c.pref === pref)) out.push(...careerQs(c, prefOnly));
  }
  if (types.includes("school") && SCHOOLS_RAW[pref]) {
    for (const [name, yomi, fact, rare] of SCHOOLS_RAW[pref]) out.push({ kind: "高校野球", name: name + "高校", yomi, pref, fact, rare });
  }
  if (types.includes("meisan") && MEISAN[pref]) {
    out.push({ kind: "名産", name: MEISAN[pref].map(m => `「${m}」`).join(""), yomi: "", pref, fact: `${pref}の名産だよ。${P[pref].region}にある${pref.endsWith("都") ? "都" : pref.endsWith("府") ? "府" : pref === "北海道" ? "道" : "県"}だね。` });

  return out;
}

  "名産": "これが名産なのは どこの都道府県？"
};

const AREAS = {
  free:  { label: "フリーモード", desc: "全国から好きなだけ", regions: null },
  kanto: { label: "関東モード", desc: "関東の7都県で9回勝負", regions: ["関東地方"] },
  east:  { label: "東日本モード", desc: "北海道・東北・関東・中部", regions: ["北海道地方", "東北地方", "関東地方", "中部地方"] },
  west:  { label: "西日本モード", desc: "近畿・中国・四国・九州・沖縄", regions: ["近畿地方", "中国地方", "四国地方", "九州地方"] }
};
const areaPrefs = id => PREFS.filter(p => !AREAS[id].regions || AREAS[id].regions.includes(p.region)).map(p => p.name);

function makeChoices(correct, pool) {
  const c = P[correct];
  let others;
  if (pool && pool.length >= 4) {
    others = shuffle(pool.filter(n => n !== correct)).slice(0, 3);
  } else {
    const near = shuffle(PREFS.filter(p => p.region === c.region && p.name !== correct)).slice(0, 1).map(p => p.name);
    const far = shuffle(PREFS.filter(p => p.name !== correct && !near.includes(p.name))).slice(0, 3 - near.length).map(p => p.name);
    others = [...near, ...far];
  }
  return shuffle([correct, ...others]).map(n => P[n]);
}

// ---------- セーブ（この端末のブラウザに保存） ----------
const SAVE_KEY = "tdfk-baseball-saves-v2";
let save = { slots: [null, null, null, null, null], current: null };
try {
  const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
  if (raw && Array.isArray(raw.slots)) save = raw;
} catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };
const newSlot = name => ({ name, stamps: [], best: {}, trip: 0, tripClears: 0, bestStreak: 0, types: ALL_TYPES.slice() });
const me = () => save.current != null ? save.slots[save.current] : null;
const addStamp = pref => { const s = me(); if (s && !s.stamps.includes(pref)) s.stamps.push(pref); };

// ---------- 地図 ----------
function mapSvg({ got = [], done = [], on = null, miss = null, label = true } = {}) {
  const pad = 16;
  const vb = `${-pad} ${-pad} ${MAP.w + pad * 2} ${MAP.h + pad * 2}`;
  const paths = Object.entries(MAP.paths).map(([n, d]) => {
    const cls = n === on ? "on" : n === miss ? "miss" : done.includes(n) ? "done" : got.includes(n) ? "got" : "";
    return `<path d="${d}" class="${cls}"><title>${n}</title></path>`;
  }).join("");
  const [ix0, iy0, ix1, iy1] = MAP.inset;
  let marks = "";
  for (const [n, pulse] of [[miss, false], [on, true]]) {
    if (!n) continue;
    const [x, y] = MAP.cen[n];
    marks += `<circle class="ring" cx="${x}" cy="${y}" r="26" style="stroke:${n === miss ? "var(--stitch)" : "var(--lamp)"}"/>`;
    if (pulse) marks += `<circle class="ring pulse" cx="${x}" cy="${y}" r="26"/>`;
    if (label) {
      const right = x < MAP.w * 0.55;
      marks += `<text x="${right ? x + 40 : x - 40}" y="${y + 14}" text-anchor="${right ? "start" : "end"}">${n}</text>`;
    }
  }
  return `<div class="map"><svg viewBox="${vb}" role="img" aria-label="日本地図">
    <rect class="inset" x="${ix0}" y="${iy0}" width="${ix1 - ix0}" height="${iy1 - iy0}" rx="10"/>
    ${paths}${marks}
    <text class="credit" x="${MAP.w}" y="${MAP.h + 8}" text-anchor="end">地図：地球地図日本（国土地理院）をもとに作成</text>
  </svg></div>`;
}

// ---------- ゲーム ----------
function startGame(mode) {
  const s = me();
  game = { mode, i: 0, results: [], ok: 0, n: 0, streak: 0, used: [], over: false };
  if (mode === "trip") game.pool = null;
  else game.pool = areaPrefs(mode);
  nextQuestion();
}

function nextQuestion() {
  const s = me();
  let pref;
  if (game.mode === "trip") {
    game.tripIdx = s.trip;
    pref = PREFS[s.trip].name;
  } else {
    const avail = game.pool.filter(n => questionsFor(n, s.types).length);
    const fresh = avail.filter(n => !game.used.includes(n));
    pref = pick(fresh.length ? fresh : avail);
    game.used.push(pref);
    if (game.used.length >= avail.length) game.used = [];
  }
  const prefOnly = game.mode === "trip";
  let qs = questionsFor(pref, s.types, prefOnly);
  if (!qs.length) qs = questionsFor(pref, ["school", "meisan"]);
  game.q = pick(qs);
  game.q.answer = game.q.answer || pref;
  const pool = game.mode === "kanto" ? game.pool : null;
  game.choices = game.q.options ? game.q.options.map(n => ({ name: n, yomi: "" })) : makeChoices(pref, pool);
  game.answered = false;
  game.picked = null;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function boardHtml() {
  const s = me();
  if (game.mode === "trip") {
    const cur = PREFS[game.tripIdx];
    return `<div class="board">
      <div class="trip-head"><b>日本一周 ${s.trip}/47</b><span class="muted">いま：${game.answered && game.lastOk ? cur.name : "？？？"}（${cur.region}）</span></div>
      <div class="trip-bar"><i style="width:${(s.trip / 47 * 100).toFixed(1)}%"></i></div>
      <div class="board-meta"><span>せいかいすると次の都道府県へ進むよ。まちがえたら同じ場所でもう一回！</span></div>
    </div>`;
  }
  if (game.mode === "free") {
    return `<div class="board"><div class="tally">
      <div><b>${game.ok}</b><span>せいかい</span></div>
      <div><b>${game.n}</b><span>もんだい</span></div>
      <div><b>${game.streak}</b><span>れんぞく</span></div>
    </div><div class="board-meta"><span>フリーモード：全国から出るよ</span><span>さいこう ${s.bestStreak}れんぞく</span></div></div>`;
  }
  const head = ["", ...Array.from({ length: 9 }, (_, i) => i + 1), "R"].map(h => `<th>${h}</th>`).join("");
  const cells = Array.from({ length: 9 }, (_, i) => {
    const r = game.results[i];
    const now = !game.over && i === game.i ? " now" : "";
    if (r === true) return `<td class="hit${now}">1</td>`;
    if (r === false) return `<td class="out${now}">0</td>`;
    return `<td class="${now.trim()}"></td>`;
  }).join("");
  const total = game.results.filter(Boolean).length;
  return `<div class="board"><div class="board-scroll"><table>
    <thead><tr>${head}</tr></thead>
    <tbody><tr><td class="name">${esc(s.name)}</td>${cells}<td class="total">${total}</td></tr></tbody>
  </table></div><div class="board-meta"><span>${AREAS[game.mode].label}：${AREAS[game.mode].desc}</span><span>1問せいかいで1点</span></div></div>`;
}

function renderGame() {
  if (game.over) return renderResult();
  const s = me();
  const q = game.q;
  const inningLabel = game.mode === "trip" ? `${game.tripIdx + 1}こめ` : game.mode === "free" ? `${game.n + (game.answered ? 0 : 1)}問め` : `${game.i + 1}回`;
  let html = boardHtml();
  if (game.mode === "trip") {
    const doneList = PREFS.slice(0, game.tripIdx).map(p => p.name);
    if (!game.answered) html += mapSvg({ done: doneList, label: false });
  }
  html += `
    <div class="pitch">
      <div><span class="inning">${inningLabel}</span><span class="tag">${q.kind}</span>${q.sub ? `<span class="tag red">${esc(q.sub)}</span>` : ""}</div>
      <p class="subject">${esc(q.name)}</p>
      ${q.yomi ? `<div class="reading">${esc(q.yomi)}</div>` : ""}
      <p class="ask">${q.ask || ASK[q.kind]}</p>
      <div class="hint-row"><button class="hint-btn" id="hint-btn">ヒントを見る</button><span class="hint" id="hint" hidden>${P[q.pref].region}だよ</span></div>
    </div>
    <div class="choices">
      ${game.choices.map((c, k) => {
        let cls = "";
        if (game.answered) cls = c.name === q.answer ? "right" : k === game.picked ? "wrong" : "";
        return `<button class="choice ${cls}" data-k="${k}" ${game.answered ? "disabled" : ""}><b${c.name.length > 7 ? ' style="font-size:17px"' : ""}>${esc(c.name)}</b>${c.yomi ? `<span>${c.yomi}</span>` : ""}</button>`;
      }).join("")}
    </div>`;
  if (game.answered) html += callHtml();
  app.innerHTML = html;
  const hb = document.getElementById("hint-btn");
  hb.onclick = () => { document.getElementById("hint").hidden = false; hb.hidden = true; };
  if (!game.answered) app.querySelectorAll(".choice").forEach(b => b.onclick = () => answer(+b.dataset.k));
  else {
    const nb = document.getElementById("next-btn");
    nb.onclick = afterCall;
    nb.focus({ preventScroll: true });
    const qb = document.getElementById("quit-btn");
    if (qb) qb.onclick = () => { game = null; render(); };
    document.getElementById("call").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function callHtml() {
  const s = me();
  const q = game.q;
  const p = P[q.pref];
  const ok = game.lastOk;
  const hitWords = ["ヒット！", "ツーベース！", "ホームラン！", "タイムリー！", "ナイスバッティング！"];
  const title = ok ? game.hitWord : (game.mode === "trip" ? "おしい！もう一回" : "おしい、アウト！");
  const verb = q.kind === "選手" || q.kind === "メジャー" || q.kind === "道のり" ? "出身" : "";
  const missName = !ok && P[game.choices[game.picked].name] ? game.choices[game.picked].name : null;
  let mapOpts = { on: q.pref, miss: missName };
  if (game.mode === "trip") mapOpts.done = PREFS.slice(0, game.tripIdx).map(x => x.name);
  else mapOpts.got = s.stamps;
  let next = "つぎのバッター";
  if (game.mode === "trip") next = ok ? (s.trip >= 47 ? "ゴール！" : "つぎの都道府県へ") : "もう一回チャレンジ";
  else if (game.mode !== "free" && game.i === 8) next = "しあい終了！けっかを見る";
  return `
    <div class="call ${ok ? "hit" : ""}" id="call">
      <h2>${title}</h2>
      ${q.kind === "道のり" ? `<p>こたえは <b>${esc(q.answer)}</b>。${esc(q.name)}は ${p.name}（${p.yomi}）出身だよ。${ok ? "スタンプゲット！" : ""}</p>` : `<p>${esc(q.name)}は <b>${p.name}</b>（${p.yomi}）${verb}だよ。${ok ? "スタンプゲット！" : ""}</p>`}
      ${ok || game.mode !== "trip" ? `<p class="fact">${q.rare ? `<span class="rare">びっくり記録</span>` : ""}${esc(q.fact)}</p>` : `<p class="fact">地図で場所をたしかめてから、もう一回やってみよう。</p>`}
      ${q.path ? `<p class="mlb"><b>道のり</b>　${q.path.map(esc).join(" → ")}</p>` : q.mlb && (ok || game.mode !== "trip") ? `<p class="mlb"><b>メジャーにも行ったよ</b>　${esc(q.mlb)}</p>` : ""}
      ${q.kind !== "名産" ? `<div class="meisan">${p.name}の名産：${MEISAN[p.name].map(m => `<em>${m}</em>`).join("")}</div>` : ""}
      ${mapSvg(mapOpts)}
      <button class="primary" id="next-btn">${next}</button>
      ${game.mode === "free" ? `<button class="ghost" id="quit-btn">ここでおわる</button>` : ""}
    </div>`;
}

function answer(k) {
  if (game.answered) return;
  const s = me();
  const ok = game.choices[k].name === game.q.answer;
  game.answered = true; game.picked = k; game.lastOk = ok;
  game.hitWord = pick(["ヒット！", "ツーベース！", "ホームラン！", "タイムリー！", "ナイスバッティング！"]);
  if (ok) addStamp(game.q.pref);
  if (game.mode === "free") {
    game.n++; if (ok) { game.ok++; game.streak++; } else game.streak = 0;
    if (game.streak > s.bestStreak) s.bestStreak = game.streak;
  } else if (game.mode === "trip") {
    if (ok) s.trip++;
  } else {
    game.results.push(ok);
  }
  persist();
  renderGame();
}

function afterCall() {
  const s = me();
  if (game.mode === "trip") {
    if (s.trip >= 47) { s.trip = 0; s.tripClears++; persist(); game.over = true; game.tripDone = true; return render(); }
    return nextQuestion();
  }
  if (game.mode === "free") return nextQuestion();
  if (game.i === 8) {
    game.over = true;
    const score = game.results.filter(Boolean).length;
    if (s.best[game.mode] == null || score > s.best[game.mode]) { s.best[game.mode] = score; game.newBest = true; }
    persist();
    return render();
  }
  game.i++;
  nextQuestion();
}

function renderResult() {
  const s = me();
  if (game.tripDone) {
    app.innerHTML = `<div class="result">
      <div class="big">日本一周</div>
      <h2>ゴール！おめでとう、${esc(s.name)}！</h2>

      <div class="row"><button class="primary" id="again">もう一周する</button><button class="ghost" id="home">モードをえらぶ</button></div>
    </div>`;
    document.getElementById("again").onclick = () => startGame("trip");
    document.getElementById("home").onclick = () => { game = null; render(); };
    return;
  }
  const score = game.results.filter(Boolean).length;
  const msg = score === 9 ? ["パーフェクトゲーム！", "9回ぜんぶせいかい。もう都道府県のエースだね。"]
    : score >= 7 ? ["だいしょうり！", "あと少しでパーフェクト。まちがえた県をもう一回おぼえよう。"]
    : score >= 4 ? ["ナイスゲーム！", "いい打線だった！くりかえすと、どんどん点がとれるよ。"]
    : ["つぎは逆転だ！", "まずはヒントを見ながらでOK。地方から考えてみよう。"];
  app.innerHTML = boardHtml() + `<div class="result">
    <div class="big">${score}点</div>
    <h2>${msg[0]}</h2>
    <p>${msg[1]}${game.newBest ? "　ベスト記録こうしん！" : ""}</p>
    <p>スタンプ帳 ${s.stamps.length} / 47</p>
    <div class="row"><button class="primary" id="again">もう一回</button><button class="ghost" id="home">モードをえらぶ</button><button class="ghost" id="to-book">スタンプ帳</button></div>
  </div>`;
  document.getElementById("again").onclick = () => startGame(game.mode);
  document.getElementById("home").onclick = () => { game = null; render(); };
  document.getElementById("to-book").onclick = () => { game = null; view = "book"; render(); };
}

function renderBook() {
  const s = me();
  const regions = [...new Set(PREFS.map(p => p.region))];
  app.innerHTML = `
    <div class="book-head"><h2 class="sec">${esc(s.name)}のスタンプ帳</h2><span class="count">${s.stamps.length} / 47</span></div>
    <p class="muted">せいかいした都道府県が地図にぬられていくよ。47こ ぜんぶ集めたら 日本一！</p>
    ${mapSvg({ got: s.stamps, label: false })}
    <div class="legend"><span><i style="background:#6f8f5a"></i>スタンプあり</span><span><i style="background:var(--land)"></i>まだ</span></div>
    ${regions.map(r => `
      <div class="region"><h3>${r}</h3>
        <div class="cells">${PREFS.filter(p => p.region === r).map(p => `<div class="cell ${s.stamps.includes(p.name) ? "got" : ""}"><b>${p.name}</b><span>${p.yomi}</span><span>${MEISAN[p.name].join("・")}</span></div>`).join("")}</div>
      </div>`).join("")}`;
}

render();

</script>

</body>
</html>
